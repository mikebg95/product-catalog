spring:
  application:
    name: catalog-service
  jpa:
    hibernate:
      ddl-auto: validate
  mvc:
    problemdetails:
      # spring's own errors (like 400 from validation) also use the problem format, like the 404
      enabled: true
  jackson:
    # leave out empty fields, so a product without a price has no price field
    default-property-inclusion: non_null

management:
  endpoints:
    web:
      exposure:
        # metrics: every request's time is recorded, e.g. the slowest search of the demo (http.server.requests)
        include: health, metrics, prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    distribution:
      # time buckets for requests, so grafana can show "95% of requests faster than ..."
      percentiles-histogram:
        http.server.requests: true

price-system:
  base-url: http://localhost:8081
  connect-timeout: 2s
  read-timeout: 5s
  max-retries: 2
  retry-delay: 500ms

price-sync:
  interval: 10s
  lock-at-most-for: 1m
  lock-at-least-for: 9s
