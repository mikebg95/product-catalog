services:
  catalog-service: &catalog-service
    build: ./catalog-service
    ports:
      - "8080:8080"
    healthcheck:
      test: [ "CMD", "wget", "-qO-", "http://localhost:8080/actuator/health/readiness" ]
      interval: 10s
      start_period: 30s
      retries: 3
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-catalog}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-catalog}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-catalog}
      PRICE_SYSTEM_BASE_URL: http://fake-price-service:8080
    depends_on:
      postgres:
        condition: service_healthy

  # a second copy, like in production; shedlock makes sure only one of them runs the price sync
  catalog-service-2:
    <<: *catalog-service
    ports: []

  fake-price-service:
    build: ./fake-price-service
    ports:
      - "8081:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health/readiness"]
      interval: 10s
      start_period: 30s
      retries: 3

  # build from repo root, because builds generate types from catalog-service's OpenAPI contract
  catalog-ui:
    build:
      context: .
      dockerfile: catalog-ui/Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - catalog-service

  fake-pim:
    build:
      context: .
      dockerfile: fake-pim/Dockerfile
    ports:
      - "3001:80"
    depends_on:
      - catalog-service
      - fake-price-service

  fake-price-ui:
    build:
      context: .
      dockerfile: fake-price-ui/Dockerfile
    ports:
      - "3002:80"
    depends_on:
      - fake-price-service

  prometheus:
    image: prom/prometheus:v3.5.0
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - catalog-service
      - catalog-service-2

  grafana:
    image: grafana/grafana:12.1.0
    environment:
      # demo only: open without logging in
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/catalog.json
    volumes:
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring/grafana/dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3003:3000"
    depends_on:
      - prometheus

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-catalog}
      POSTGRES_USER: ${POSTGRES_USER:-catalog}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-catalog}
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER:-catalog}"]
      interval: 5s
      retries: 10