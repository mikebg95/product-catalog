<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>C4 Model</title>
<style>
  :root {
    --bg: #f6f7f9;
    --dot: #d9dde3;
    --text: #1d2330;
    --muted: #5b6475;
    --line: #6b7385;
    --panel: rgba(255, 255, 255, 0.92);
    --panel-border: #dfe3ea;
    --active: #1168bd;
    --on-active: #ffffff;
    --person: #08427b;
    --system: #1168bd;
    --container: #438dd5;
    --external: #8a8f98;
    --boundary-text: #0b4f94;
    --external-text: #5d636d;
    --on-box: #ffffff;
    --on-box-muted: rgba(255, 255, 255, 0.78);
    --component: #85bbf0;
    --on-component: #0b2545;
    --on-component-muted: rgba(11, 37, 69, 0.72);
    --card: #ffffff;
    --card-solid: #ffffff;
    --chip-bg: #eef1f5;
    --code-bg: #0f172a;
    --code-text: #e2e8f0;
    --todo-text: #b45309;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #13161c;
      --dot: #262b35;
      --text: #e7eaf0;
      --muted: #9aa3b5;
      --line: #8c95a8;
      --panel: rgba(28, 32, 40, 0.92);
      --panel-border: #2d3340;
      --active: #2a7fd4;
      --person: #0d4f91;
      --system: #1a73cf;
      --container: #3a82c9;
      --external: #5e636c;
      --boundary-text: #8cbcf0;
      --external-text: #aab0ba;
      --card: rgba(255, 255, 255, 0.04);
      --card-solid: #1a1f29;
      --chip-bg: #262c38;
      --code-bg: #0b0e14;
      --todo-text: #fbbf24;
    }
  }
  :root[data-theme="dark"] {
    --bg: #13161c;
    --dot: #262b35;
    --text: #e7eaf0;
    --muted: #9aa3b5;
    --line: #8c95a8;
    --panel: rgba(28, 32, 40, 0.92);
    --panel-border: #2d3340;
    --active: #2a7fd4;
    --person: #0d4f91;
    --system: #1a73cf;
    --container: #3a82c9;
    --external: #5e636c;
    --boundary-text: #8cbcf0;
    --external-text: #aab0ba;
    --card: rgba(255, 255, 255, 0.04);
    --card-solid: #1a1f29;
    --chip-bg: #262c38;
    --code-bg: #0b0e14;
    --todo-text: #fbbf24;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, Helvetica, Arial, sans-serif;
    overflow: hidden;
  }

  #viewport {
    position: fixed;
    inset: 0;
    cursor: grab;
    touch-action: none;
    background-image: radial-gradient(var(--dot) 1.2px, transparent 1.2px);
  }
  #viewport.dragging { cursor: grabbing; }
  #viewport.over-box { cursor: zoom-in; }
  svg { width: 100%; height: 100%; display: block; user-select: none; }

  .panel {
    position: fixed;
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 10px;
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
  }
  header.panel {
    top: 16px; left: 16px; max-width: calc(100% - 32px);
    padding: 8px 8px 8px 14px;
    display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px;
  }
  header h1 { margin: 0; font-size: 15px; font-weight: 650; }
  .levels { display: flex; gap: 2px; background: var(--panel-border); padding: 2px; border-radius: 8px; }
  .levels button {
    border: 0; border-radius: 6px; padding: 5px 10px;
    background: transparent; color: var(--muted);
    font: inherit; font-size: 12px; font-weight: 600; cursor: pointer;
    transition: background 0.2s, color 0.2s;
  }
  .levels button[aria-pressed="true"] { background: var(--active); color: var(--on-active); }

  .toolbar { bottom: 16px; right: 16px; display: flex; align-items: center; padding: 4px; gap: 2px; }
  .toolbar button {
    width: 32px; height: 32px; border: 0; border-radius: 7px;
    background: transparent; color: var(--text);
    font-size: 18px; line-height: 1; cursor: pointer;
  }
  .toolbar button:hover { background: var(--panel-border); }
  .toolbar button.fit { width: auto; padding: 0 10px; font-size: 12px; font-weight: 600; }
  .toolbar .zoom { min-width: 46px; text-align: center; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }

  .hint { bottom: 16px; left: 16px; padding: 8px 12px; font-size: 12px; color: var(--muted); max-width: calc(100% - 220px); line-height: 1.5; }
  .hint strong { color: var(--text); font-weight: 600; }
  @media (max-width: 560px) { .hint { display: none; } }

  /* diagram */
  .person { fill: var(--person); }
  .system { fill: var(--system); }
  .container { fill: var(--container); }
  .external { fill: var(--external); }
  .name { fill: var(--on-box); font-size: 22px; font-weight: 700; text-anchor: middle; }
  .kind { fill: var(--on-box-muted); font-size: 13px; text-anchor: middle; }
  .desc { fill: var(--on-box); font-size: 15px; text-anchor: middle; }
  .demo { fill: var(--on-box-muted); font-size: 13px; font-style: italic; text-anchor: middle; }
  .rel { stroke: var(--line); stroke-width: 2; fill: none; stroke-dasharray: 7 5; }
  .arrowhead { fill: var(--line); }
  .rel-label { fill: var(--text); font-size: 15px; font-weight: 600; }
  .rel-tech { fill: var(--muted); font-size: 13px; }
  .legend-text { fill: var(--muted); font-size: 13px; }
  /* a halo in the page color, so lines (like the boundary edge) never run through a label */
  .rel-endpoint { fill: var(--muted); font-size: 12px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  .rel-label, .rel-tech, .rel-endpoint { paint-order: stroke; stroke: var(--bg); stroke-width: 6px; stroke-linejoin: round; }
  #catalog-rect { stroke: var(--system); stroke-width: 2; stroke-dasharray: 10 6; }
  .db-rim { fill: none; stroke: rgba(255, 255, 255, 0.45); stroke-width: 1.5; }
  .boundary-name { fill: var(--boundary-text); font-size: 18px; font-weight: 700; }
  .boundary-kind { fill: var(--muted); font-size: 13px; }
  /* the frontends use the same color as their app's banner */
  .fe-catalog { fill: #db2777; }
  .fe-pim { fill: #059669; }
  .fe-price { fill: #ea580c; }
  .ext-rect { stroke: var(--external); stroke-width: 2; stroke-dasharray: 10 6; }
  .ext-boundary-name { fill: var(--external-text); font-size: 18px; font-weight: 700; }
  /* level 3: components are light blue with dark text, as in C4 */
  .component { fill: var(--component); }
  .c-name { fill: var(--on-component); font-size: 22px; font-weight: 700; text-anchor: middle; }
  .c-kind { fill: var(--on-component-muted); font-size: 13px; text-anchor: middle; }
  .c-desc { fill: var(--on-component); font-size: 15px; text-anchor: middle; }
  .hex-app { fill: var(--component); stroke: #4f8fd1; stroke-width: 2; }
  .hex-domain { fill: #c4def8; stroke: #4f8fd1; stroke-width: 2; }
  .socket { fill: #2b5f99; }
  .socket-hole { fill: #0b2545; }
  .plug { fill: var(--component); stroke: #2b5f99; stroke-width: 2; }
  .prong { fill: #b8bfcc; }
  .cable { stroke: #2b5f99; stroke-width: 5; stroke-linecap: round; }
  .port-name { fill: var(--on-component); font-size: 15px; font-weight: 700; }
  .port-kind { fill: var(--on-component-muted); font-size: 13px; }
  .realize { stroke: var(--line); stroke-width: 2; fill: none; stroke-dasharray: 7 5; }
  .realize-head { fill: var(--bg); stroke: var(--line); stroke-width: 1.5; }
  .core-rel { stroke: #2b5f99; stroke-width: 2; fill: none; stroke-dasharray: 7 5; }
  .core-arrowhead { fill: #2b5f99; }
  .core-rel-label { fill: var(--on-component); font-size: 14px; font-weight: 700; }
  .focusable { cursor: zoom-in; }
  .focusable > path { transition: filter 0.15s; }
  .focusable:hover > path { filter: brightness(1.05); }
  #l3.f-domain [data-focus="domain"], #l3.f-app [data-focus="app"] { cursor: default; }
  #l3.f-domain [data-focus="domain"] > path, #l3.f-app [data-focus="app"] > path { filter: none; }
  .l4 { opacity: 0; pointer-events: none; transition: opacity 0.45s 0.2s; }
  #l3.f-all .l4, #scene.f-all .l4-fps, #scene.f-all .l4-db { opacity: 1; }
  #l3.f-all .l4-domain { pointer-events: auto; }
  #l3.f-all .l3-domain-simple, #l3.f-all .l3-app-simple, #l3.f-all .l3-web-simple, #l3.f-all .l3-persist-simple,
  #l3.f-all .l3-pclient-simple, #scene.f-all .l3-fps-simple, #scene.f-all .l3-db-simple { opacity: 0; pointer-events: none; }
  #l3.f-web .l4-web, #l3.f-persist .l4-persist, #l3.f-pclient .l4-pclient,
  #l3.flow-app .l4-web, #l3.flow-app .l4-persist, #l3.flow-app .l4-pclient { opacity: 1; }
  .l3-web-simple, .l3-persist-simple, .l3-pclient-simple { transition: opacity 0.3s; }
  #l3.f-web .l3-web-simple, #l3.f-persist .l3-persist-simple, #l3.f-pclient .l3-pclient-simple,
  #l3.flow-app .l3-web-simple, #l3.flow-app .l3-persist-simple, #l3.flow-app .l3-pclient-simple { opacity: 0; }
  .l4-db, .l3-db-simple { transition: opacity 0.4s; }
  .l4-db { opacity: 0; pointer-events: none; }
  #scene.f-db .l4-db, #scene.flow-app .l4-db { opacity: 1; }
  #scene.f-db .l3-db-simple, #scene.flow-app .l3-db-simple { opacity: 0; }
  #scene.f-db [data-focus="db"] { cursor: default; }
  .db-table { fill: #f7fbff; stroke: #2b5f99; stroke-width: 1; }
  .db-head { fill: #2b5f99; }
  .db-name { fill: #fff; font: 700 6.5px ui-monospace, SFMono-Regular, Menlo, monospace; }
  .db-meta { fill: rgba(255, 255, 255, 0.8); font-size: 4.4px; font-weight: 700; letter-spacing: 0.06em; }
  .db-col { fill: #0b2545; font: 700 5.4px ui-monospace, SFMono-Regular, Menlo, monospace; }
  .db-type { fill: #1d6fd1; font: 5.4px ui-monospace, SFMono-Regular, Menlo, monospace; }
  .db-note { fill: #475569; font-size: 4.8px; }
  .db-col.db-todo, .db-type.db-todo, .db-note.db-todo { fill: #b45309; }
  .uml-planned { stroke-dasharray: 3 2; }
  .uml-stereo.uml-planned-text { fill: #b45309; font-size: 4.6px; text-anchor: start; }
  .l4-fps, .l3-fps-simple { transition: opacity 0.4s; }
  .l4-fps { opacity: 0; pointer-events: none; }
  #scene.f-fps .l4-fps, #scene.flow-app .l4-fps { opacity: 1; }
  #scene.f-fps .l3-fps-simple, #scene.flow-app .l3-fps-simple { opacity: 0; }
  #scene.f-fps [data-focus="fps"] { cursor: default; }
  .ext-title { fill: var(--on-box); }
  .ext-who { fill: #fdba74; }
  .ext-band { fill: rgba(255, 255, 255, 0.14); stroke: rgba(255, 255, 255, 0.7); }
  .ext-store { fill: #fff7ed; stroke: #ea580c; }
  .ext-call { stroke: #2b5f99; stroke-width: 1.2; }
  #l3.f-web [data-focus="web"], #l3.f-persist [data-focus="persist"], #l3.f-pclient [data-focus="pclient"] { cursor: default; }
  .focusable:hover > rect.component { filter: brightness(1.06); }
  .ad-title { fill: var(--on-component); font-size: 9.5px; font-weight: 700; }
  .ad-band { fill: rgba(43, 95, 153, 0.16); stroke: #2b5f99; stroke-width: 1; stroke-dasharray: 4 2.5; }
  .ad-band-label { fill: #0b2545; font-size: 7.5px; font-weight: 700; }
  .ad-band-sub { fill: var(--on-component-muted); font-size: 5.6px; }
  .ad-who { font-size: 5.2px; font-weight: 800; letter-spacing: 0.08em; }
  .ad-fw { fill: #475569; }
  .ad-yours { fill: #15803d; }
  .ad-code { fill: #f7fbff; stroke: #2b5f99; stroke-width: 1.2; }
  .ad-name-s { fill: #0b2545; font-size: 6px; font-weight: 700; }
  .ad-step { fill: #0b2545; font-size: 5.4px; font-weight: 700; }
  .built-tag { fill: #15803d !important; }
  .ad-jpa { fill: rgba(255, 255, 255, 0.55); stroke: #475569; stroke-width: 1; stroke-dasharray: 3 2; }
  .ad-name { fill: #0b2545; font-size: 8px; font-weight: 700; }
  .ad-line { fill: #0b2545; font: 6px ui-monospace, SFMono-Regular, Menlo, monospace; }
  .ad-tag { fill: #b45309; font-size: 5.2px; font-weight: 800; letter-spacing: 0.06em; }
  #l3.f-domain .l4-domain, #l3.f-app .l4-app, #l3.flow-app .l4-app { opacity: 1; pointer-events: auto; }
  .l3-domain-simple, .l3-app-simple { transition: opacity 0.3s; }
  #l3.f-domain .l3-domain-simple, #l3.f-app .l3-app-simple, #l3.flow-app .l3-app-simple { opacity: 0; pointer-events: none; }
  .uml { fill: #f7fbff; stroke: #2b5f99; stroke-width: 1; }
  .uml-head { fill: #2b5f99; }
  .uml-name { fill: #fff; font-size: 8.5px; font-weight: 700; text-anchor: middle; }
  .uml-stereo { fill: rgba(255, 255, 255, 0.8); font-size: 5.5px; text-anchor: middle; }
  .uml-line { fill: #0b2545; font: 6px ui-monospace, SFMono-Regular, Menlo, monospace; }
  .uml-sep { stroke: #2b5f99; stroke-width: 0.8; }
  .uml-mult { fill: var(--on-component); font-size: 6px; font-weight: 700; }
  .uml-rule { fill: var(--on-component); font-size: 5.5px; text-anchor: middle; }
  .uml-hint { fill: var(--on-component-muted); font-size: 5.5px; font-style: italic; text-anchor: middle; }
  .model:hover .uml { fill: #ffffff; stroke-width: 1.5; }
  .svc-box { fill: rgba(255, 255, 255, 0.6); stroke: #2b5f99; stroke-width: 1.5; stroke-dasharray: 5 3; }
  .svc-name { fill: #0b2545; font-size: 11px; font-weight: 700; text-anchor: middle; }
  .svc-tag { fill: #b45309; font-size: 7px; font-weight: 800; letter-spacing: 0.06em; text-anchor: middle; }
  .svc-line { fill: #0b2545; font: 9px ui-monospace, SFMono-Regular, Menlo, monospace; text-anchor: middle; }
  .svc-note { fill: var(--on-component-muted); font-size: 8px; text-anchor: middle; }
  .port-method { fill: #0b2545; font: 9px ui-monospace, SFMono-Regular, Menlo, monospace; }
  .port-tag { fill: #b45309; font-size: 8px; font-weight: 700; }
  /* Labels that fade out as boxes open stay in place, invisible: they must never catch a click */
  [id$="-closed"], #catalog-l1, #boundary-label, #svc-l2 { pointer-events: none; }
  .halo { paint-order: stroke; stroke: var(--component); stroke-width: 7px; stroke-linejoin: round; }
  .model { cursor: pointer; }
  .app-link { cursor: pointer; }
  .open-app { fill: var(--on-box); font-size: 12px; font-weight: 700; text-anchor: middle; opacity: 0.85; }
  .app-link:hover .open-app { opacity: 1; text-decoration: underline; }
  .toast {
    position: fixed; left: 50%; bottom: 24px; z-index: 30; max-width: min(460px, calc(100% - 32px));
    padding: 12px 16px; font-size: 13px; line-height: 1.5;
    transform: translate(-50%, 20px); opacity: 0; transition: transform 0.3s, opacity 0.3s;
  }
  .toast.show { transform: translate(-50%, 0); opacity: 1; }
  .toast a { color: var(--active); font-weight: 600; }
  .toast code { font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; }
  .model-card { fill: #f7fbff; stroke: #4f8fd1; stroke-width: 2; transition: fill 0.15s, stroke 0.15s, filter 0.15s; }
  .model:hover .model-card, .model:focus-visible .model-card { fill: #ffffff; stroke: #1d6fd1; filter: drop-shadow(0 4px 8px rgba(11, 37, 69, 0.25)); }
  .model:focus { outline: none; }
  .model-name { fill: var(--on-component); font-size: 16px; font-weight: 700; text-anchor: middle; }
  .model-kind { fill: var(--on-component-muted); font-size: 11px; text-anchor: middle; }
  .model-hint { fill: var(--on-component-muted); font-size: 11px; font-style: italic; text-anchor: middle; }
  .assoc { stroke: #2b5f99; stroke-width: 2; }
  .assoc-label { fill: var(--on-component); font-size: 11px; font-weight: 700; }
  .assoc-diamond { fill: #2b5f99; }
  #svc-rect { stroke: var(--container); stroke-width: 2; stroke-dasharray: 10 6; stroke-opacity: 0; }
  .box { transition: filter 0.15s; }
  .box:hover { filter: brightness(1.08); }

  /* ---- flows ---- */
  [hidden] { display: none !important; }
  .flows-btn {
    display: inline-flex; align-items: center; gap: 6px;
    border: 0; border-radius: 8px; padding: 6px 12px 6px 10px;
    font: inherit; font-size: 12px; font-weight: 700; color: #fff; cursor: pointer;
    background: linear-gradient(135deg, #3b82f6, #8b5cf6 55%, #ec4899);
    box-shadow: 0 4px 14px rgba(139, 92, 246, 0.35);
    transition: transform 0.15s, box-shadow 0.15s;
  }
  .prod-hint { fill: var(--on-box); font-size: 12.5px; font-weight: 700; text-anchor: middle; text-decoration: underline; cursor: pointer; pointer-events: auto; opacity: 0.9; }
  .prod-hint:hover { opacity: 1; }
  .prod-link {
    display: inline-flex; align-items: center; padding: 6px 10px; border-radius: 8px; text-decoration: none;
    font-size: 12px; font-weight: 650; color: var(--muted); background: var(--panel-border);
  }
  .prod-link:hover { color: var(--text); }
  .flows-btn:hover { transform: translateY(-1px); box-shadow: 0 6px 18px rgba(139, 92, 246, 0.45); }
  .flows-btn[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px #8b5cf6; }
  .flows-btn svg { width: 12px; height: 12px; fill: currentColor; }

  .flows-panel {
    top: 16px; right: 16px; bottom: 72px; width: 400px; z-index: 5;
    display: flex; flex-direction: column; overflow: hidden;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.18);
    transform: translateX(calc(100% + 32px));
    transition: transform 0.45s cubic-bezier(0.2, 0.8, 0.2, 1);
  }
  .flows-panel.open { transform: none; }
  .flows-head { display: flex; align-items: center; gap: 8px; padding: 12px 12px 12px 16px; border-bottom: 1px solid var(--panel-border); }
  .flows-head h2 { margin: 0; flex: 1; font-size: 15px; font-weight: 700; }
  .icon-btn {
    width: 30px; height: 30px; border: 0; border-radius: 7px; background: transparent;
    color: var(--muted); font-size: 15px; cursor: pointer;
  }
  .icon-btn:hover { background: var(--panel-border); color: var(--text); }
  #flows-body { flex: 1; overflow: auto; padding: 14px 16px 16px; }
  .flows-intro { margin: 0 0 14px; font-size: 13px; line-height: 1.5; color: var(--muted); }

  .flow-cards { display: flex; flex-direction: column; gap: 10px; }
  .flow-card {
    position: relative; display: flex; flex-direction: column; gap: 6px; width: 100%;
    padding: 12px 14px 12px 18px; text-align: left; cursor: pointer; overflow: hidden;
    font: inherit; color: var(--text);
    background: var(--card); border: 1px solid var(--panel-border); border-radius: 11px;
    transition: transform 0.15s, border-color 0.15s, box-shadow 0.15s;
  }
  .flow-card::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--flow); }
  .flow-card:hover { transform: translateY(-1px); border-color: var(--flow); box-shadow: 0 6px 18px color-mix(in srgb, var(--flow) 22%, transparent); }
  .flow-card-top { display: flex; align-items: baseline; gap: 8px; }
  .flow-card-top b { flex: 1; font-size: 14px; }
  .flow-steps { font-size: 11px; color: var(--muted); white-space: nowrap; }
  .flow-card-desc { font-size: 12.5px; line-height: 1.45; color: var(--muted); }
  .chips { display: flex; flex-wrap: wrap; gap: 5px; }
  .chip {
    font: 11px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace;
    padding: 1px 7px; border-radius: 6px; background: var(--chip-bg); color: var(--muted);
  }
  .chip-todo { background: rgba(245, 158, 11, 0.16); color: var(--todo-text); }

  .progress { display: flex; gap: 4px; margin-bottom: 12px; }
  .seg { flex: 1; height: 6px; padding: 0; border: 0; border-radius: 3px; background: var(--panel-border); cursor: pointer; transition: background 0.3s; }
  .seg.done { background: color-mix(in srgb, var(--flow) 50%, transparent); }
  .seg.now { background: var(--flow); box-shadow: 0 0 10px color-mix(in srgb, var(--flow) 60%, transparent); }

  .step-card {
    padding: 16px; border-radius: 13px; background: var(--card); border: 1px solid var(--panel-border);
    border-top: 3px solid var(--flow); animation: card-in 0.35s ease-out;
  }
  @keyframes card-in { from { opacity: 0; transform: translateY(6px); } }
  .step-num { font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--flow); }
  .step-card h2 { margin: 4px 0 8px; font-size: 18px; line-height: 1.3; }
  .step-card p { margin: 0 0 10px; font-size: 14px; line-height: 1.55; }
  .step-card code, .d-note code, .d-rules code, .d-todo code {
    font: 12.5px ui-monospace, SFMono-Regular, Menlo, monospace;
    padding: 1px 5px; border-radius: 5px; background: var(--chip-bg);
  }
  .step-type {
    display: flex; align-items: center; gap: 8px; margin-top: 12px; padding: 8px 10px; border-radius: 9px;
    background: color-mix(in srgb, var(--kind) 14%, transparent); transition: background 0.3s;
  }
  .step-type i { width: 10px; height: 10px; border-radius: 50%; background: var(--kind); box-shadow: 0 0 8px var(--kind); flex: none; }
  .step-type b { font: 700 13px ui-monospace, SFMono-Regular, Menlo, monospace; }
  .step-type span { margin-left: auto; font-size: 11.5px; color: var(--muted); }
  .step-where { display: flex; align-items: center; gap: 8px; margin-top: 6px; padding: 6px 10px; font-size: 12.5px; }
  .step-where i { width: 8px; height: 8px; border-radius: 2px; background: var(--who); flex: none; }
  .step-where b { font-weight: 600; }
  .step-where span {
    margin-left: auto; font-size: 11px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase;
    color: var(--who); padding: 1px 6px; border-radius: 5px; background: color-mix(in srgb, var(--who) 14%, transparent);
  }
  .zoom-btn {
    display: flex; align-items: center; gap: 8px; width: 100%; margin-top: 12px; padding: 10px 12px;
    border: 1px dashed var(--flow); border-radius: 9px; background: transparent; cursor: pointer;
    font: inherit; font-size: 13px; font-weight: 600; color: var(--text); text-align: left;
    transition: background 0.15s;
  }
  .zoom-btn:hover { background: color-mix(in srgb, var(--flow) 12%, transparent); }
  .zoom-btn svg { width: 18px; height: 18px; flex: none; fill: none; stroke: var(--flow); stroke-width: 2; stroke-linecap: round; }
  .zoom-btn .todo-badge { margin-left: auto; }

  .controls { display: flex; gap: 8px; margin: 14px 0; }
  .ctl {
    height: 40px; min-width: 44px; padding: 0 12px; border-radius: 10px; cursor: pointer;
    font: inherit; font-size: 14px; font-weight: 650; color: var(--text);
    background: var(--card); border: 1px solid var(--panel-border); transition: transform 0.1s, filter 0.15s;
  }
  .ctl:hover:not(:disabled) { filter: brightness(1.08); }
  .ctl:active:not(:disabled) { transform: scale(0.97); }
  .ctl:disabled { opacity: 0.35; cursor: default; }
  .ctl.primary {
    flex: 1; color: #fff; border-color: transparent; background: var(--flow);
    box-shadow: 0 6px 16px color-mix(in srgb, var(--flow) 40%, transparent);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  .fork-tag { color: #e879f9; }
  .fork-q {
    margin-top: 14px; padding: 12px; border-radius: 11px;
    background: color-mix(in srgb, #e879f9 9%, transparent); border: 1px solid color-mix(in srgb, #e879f9 40%, transparent);
  }
  .fork-q h3 { display: flex; gap: 8px; align-items: baseline; margin: 0 0 10px; font-size: 14.5px; line-height: 1.35; }
  .fork-q h3 i { color: #e879f9; font-style: normal; }
  .fork-q.nudge { animation: nudge 0.4s; }
  @keyframes nudge { 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
  .fork-opts { display: grid; gap: 8px; }
  .fork-opt {
    display: grid; grid-template-columns: auto 1fr; column-gap: 10px; align-items: center; text-align: left;
    padding: 10px 12px; border-radius: 10px; cursor: pointer; font: inherit; color: var(--text);
    background: var(--card-solid); border: 1px solid var(--panel-border); transition: transform 0.12s, border-color 0.12s, box-shadow 0.12s;
  }
  .fork-opt:hover { transform: translateY(-1px); border-color: #e879f9; box-shadow: 0 6px 16px rgba(232, 121, 249, 0.18); }
  .fork-opt kbd {
    grid-row: span 2; display: grid; place-items: center; width: 24px; height: 24px; border-radius: 6px;
    font: 700 12px ui-monospace, SFMono-Regular, Menlo, monospace; background: var(--chip-bg); color: var(--muted);
  }
  .fork-opt b { font-size: 14px; }
  .fork-opt span { font-size: 12.5px; color: var(--muted); }
  .fork-opt.chosen { border-color: #e879f9; background: color-mix(in srgb, #e879f9 14%, var(--card-solid)); }
  .fork-opt.chosen kbd { background: #e879f9; color: #fff; }
  .seg.pending { flex: 1.5; background: repeating-linear-gradient(90deg, var(--panel-border) 0 4px, transparent 4px 8px); cursor: default; }
  .fork-chip {
    flex: none; font-style: normal; font-size: 11px; font-weight: 700; padding: 1px 7px; border-radius: 6px;
    color: #c026d3; background: color-mix(in srgb, #e879f9 15%, transparent);
  }
  .step-list li.pending { color: var(--muted); font-style: italic; cursor: default; padding-left: 38px; }
  .step-list li.pending:hover { background: none; }
  .step-list { list-style: none; margin: 4px 0 14px; padding: 0; }
  .step-list li {
    display: flex; align-items: center; gap: 10px; padding: 7px 8px; border-radius: 8px;
    font-size: 13px; color: var(--muted); cursor: pointer;
  }
  .step-list li:hover { background: var(--chip-bg); }
  .step-list li span {
    flex: none; width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center;
    font-size: 11px; font-weight: 700; background: var(--chip-bg); color: var(--muted);
  }
  .step-list li.done span { background: color-mix(in srgb, var(--flow) 55%, transparent); color: #fff; }
  .step-list li.now { background: color-mix(in srgb, var(--flow) 13%, transparent); color: var(--text); font-weight: 600; }
  .step-list li.now span { background: var(--flow); color: #fff; }
  .has-zoom { margin-left: auto; flex: none; width: 8px; height: 8px; border-radius: 50%; border: 1.5px solid var(--flow); }
  .kinds { display: flex; flex-wrap: wrap; gap: 6px 12px; padding-top: 12px; border-top: 1px solid var(--panel-border); font-size: 11px; color: var(--muted); }
  .kind-dot { display: inline-block; width: 8px; height: 8px; margin-right: 5px; border-radius: 50%; background: var(--kind); vertical-align: 0; }

  /* the packet and its trail, in the diagram */
  #flow-layer { opacity: 0; pointer-events: none; transition: opacity 0.3s; }
  #flow-layer.on { opacity: 1; }
  #flow-trails path { fill: none; stroke: var(--flow); stroke-linecap: round; stroke-linejoin: round; opacity: 0.32; }
  #flow-trail-now { fill: none; stroke: var(--flow); stroke-linecap: round; stroke-linejoin: round; filter: drop-shadow(0 0 5px var(--flow)); }
  #flow-ring { fill: color-mix(in srgb, var(--flow) 8%, transparent); stroke: var(--flow); opacity: 0; }
  #flow-ring.show { animation: ring-in 0.6s ease-out forwards, ring-pulse 2.2s 0.6s ease-in-out infinite; }
  @keyframes ring-in { from { opacity: 0; } to { opacity: 0.9; } }
  @keyframes ring-pulse { 50% { opacity: 0.45; } }
  .packet-core { fill: var(--kind); stroke: #fff; stroke-width: 3; }
  .packet-glow { fill: var(--kind); opacity: 0.3; transform-box: fill-box; transform-origin: center; animation: breathe 1.6s ease-in-out infinite; }
  @keyframes breathe { 50% { transform: scale(1.35); opacity: 0.15; } }
  .packet-wave { fill: none; stroke: var(--kind); stroke-width: 2; opacity: 0; transform-box: fill-box; transform-origin: center; }
  #packet.pop .packet-wave { animation: wave 0.7s ease-out; }
  @keyframes wave { from { opacity: 0.9; transform: scale(1); } to { opacity: 0; transform: scale(4); } }
  .packet-label { transform-box: fill-box; transform-origin: 50% 100%; }
  #packet.pop .packet-label { animation: pop 0.45s cubic-bezier(0.3, 1.6, 0.5, 1); }
  @keyframes pop { from { transform: scale(0.6); } }
  #packet-pill { fill: var(--kind); stroke: rgba(255, 255, 255, 0.85); stroke-width: 1.5; filter: drop-shadow(0 3px 6px rgba(0, 0, 0, 0.35)); transition: fill 0.25s; }
  #where-pill { fill: rgba(15, 23, 42, 0.88); stroke: rgba(255, 255, 255, 0.18); stroke-width: 1; }
  #where-text { fill: #e2e8f0; font: 600 11.5px -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif; text-anchor: middle; }
  #where-dot { transition: fill 0.25s; }
  #packet-text { fill: #0b1220; font: 700 13px ui-monospace, SFMono-Regular, Menlo, monospace; text-anchor: middle; }
  .packet-core, .packet-glow, .packet-wave { transition: fill 0.25s, stroke 0.25s; }

  /* zoom-in on a step */
  .detail {
    position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; padding: 16px;
    background: rgba(8, 11, 18, 0); transition: background 0.3s, backdrop-filter 0.3s;
  }
  .detail.open { background: rgba(8, 11, 18, 0.45); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); }
  .detail-card {
    width: min(720px, 100%); max-height: calc(100vh - 32px); overflow: auto;
    background: var(--card-solid); border: 1px solid var(--panel-border); border-top: 4px solid var(--flow);
    border-radius: 16px; box-shadow: 0 30px 80px rgba(0, 0, 0, 0.4);
    transform: scale(0.04); opacity: 0;
    transition: transform 0.5s cubic-bezier(0.2, 0.9, 0.25, 1), opacity 0.3s;
  }
  .detail.open .detail-card { transform: none; opacity: 1; }
  .detail-head { display: flex; align-items: flex-start; gap: 12px; padding: 18px 18px 6px 22px; }
  .detail-head > div { flex: 1; }
  .detail-step { font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--flow); }
  .detail-head h2 { margin: 4px 0 2px; font-size: 22px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  .detail-source { font-size: 12px; color: var(--muted); }
  .detail-body { padding: 8px 22px 22px; font-size: 14px; line-height: 1.55; }
  .d-code {
    margin: 10px 0; padding: 14px 16px; border-radius: 11px; overflow: auto;
    background: var(--code-bg); color: var(--code-text);
    font: 12.5px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  .d-note { margin: 10px 0; }
  .d-rules { margin: 10px 0; padding-left: 20px; }
  .d-rules li { margin: 4px 0; }
  .d-todo {
    display: flex; gap: 10px; align-items: flex-start; margin: 14px 0 0; padding: 10px 14px; border-radius: 11px;
    border: 1px dashed #f59e0b; background: rgba(245, 158, 11, 0.08);
  }
  .d-todo ul { margin: 0; padding-left: 16px; }
  .d-todo li { margin: 2px 0; }
  .todo-badge {
    flex: none; font-size: 10px; font-weight: 800; letter-spacing: 0.08em; padding: 2px 6px; border-radius: 5px;
    background: #f59e0b; color: #1f1300;
  }
  .d-map { display: flex; flex-direction: column; gap: 6px; margin: 10px 0; }
  .d-map-head, .d-map-row { display: grid; grid-template-columns: 1fr 22px 1fr 1fr; gap: 8px; align-items: center; }
  .d-map-head { padding: 0 10px; font-size: 11px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
  .d-map-row { padding: 8px 10px; border-radius: 9px; background: var(--card); border: 1px solid var(--panel-border); }
  .d-map-row code { font: 12.5px ui-monospace, SFMono-Regular, Menlo, monospace; }
  .d-map-row code:first-child { color: #a78bfa; }
  .d-map-row code:nth-of-type(2) { color: #38bdf8; }
  .d-map-row.dropped code:nth-of-type(2), .d-map-row.added code:first-child { color: var(--muted); }
  .d-arrow { color: var(--muted); text-align: center; }
  .d-h { margin: 18px 0 6px; font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
  .d-fields { display: flex; flex-direction: column; gap: 6px; }
  .d-field { display: grid; grid-template-columns: 110px 150px 1fr; gap: 10px; align-items: baseline; padding: 8px 10px; border-radius: 9px; background: var(--card); border: 1px solid var(--panel-border); }
  .d-field code { font: 12.5px ui-monospace, SFMono-Regular, Menlo, monospace; }
  .d-field code:first-child { font-weight: 700; }
  .d-field .t { color: #38bdf8; }
  .d-field span { font-size: 12.5px; color: var(--muted); }
  .d-field span code { font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; font-weight: 400; color: var(--text); }
  .d-tests { list-style: none; margin: 6px 0 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
  .d-tests li { display: flex; gap: 8px; align-items: center; font: 12.5px ui-monospace, SFMono-Regular, Menlo, monospace; }
  .d-tests li::before { content: "✓"; display: grid; place-items: center; width: 18px; height: 18px; border-radius: 50%; background: rgba(34, 197, 94, 0.18); color: #22c55e; font: 700 11px sans-serif; flex: none; }
  @media (max-width: 760px) { .d-field { grid-template-columns: 1fr 1fr; } .d-field span { grid-column: 1 / -1; } }
  .d-map-note { font-size: 12px; color: var(--muted); }

  @media (max-width: 760px) {
    .flows-panel { left: 16px; right: 16px; width: auto; top: auto; bottom: 16px; height: 52vh; transform: translateY(calc(100% + 32px)); }
    .d-map-head, .d-map-row { grid-template-columns: 1fr 18px 1fr; }
    .d-map-note { grid-column: 1 / -1; }
  }
  @media (prefers-reduced-motion: reduce) {
    .flows-panel, .detail-card, .detail { transition: none; }
    .packet-glow, #flow-ring.show { animation: none; opacity: 0.6; }
  }
</style>
</head>
<body>

<div id="viewport">
  <svg aria-label="C4 diagrams of the Product Catalog: system context, containers and components">
    <defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M0,0 L10,5 L0,10 z" class="arrowhead"/>
      </marker>
      <!-- UML realization: an adapter implements a port -->
      <marker id="realizes" viewBox="0 0 14 14" refX="13" refY="7" markerWidth="20" markerHeight="20" orient="auto" markerUnits="userSpaceOnUse">
        <path d="M1,1 L13,7 L1,13 z" class="realize-head"/>
      </marker>
      <marker id="arrow-core" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
        <path d="M0,0 L10,5 L0,10 z" class="core-arrowhead"/>
      </marker>
    </defs>

    <g id="scene">
     <!-- Levels 1 and 2 -->
     <g id="world">
      <!-- Shopper -->
      <g class="box">
        <circle class="person" cx="720" cy="-182" r="44"/>
        <rect class="person" x="600" y="-142" width="240" height="140" rx="48"/>
        <text class="name" x="720" y="-88">Shopper</text>
        <text class="kind" x="720" y="-64">[Person]</text>
        <text class="desc" x="720" y="-32">Customer of the webshop</text>
      </g>

      <!-- Webshop: a gray box, opens to show catalog-ui -->
      <g id="webshop">
        <rect id="webshop-rect" class="external ext-rect" x="570" y="170" width="300" height="160" rx="14"/>
        <g id="webshop-closed" class="box">
          <text class="name" x="720" y="230">Webshop</text>
          <text class="kind" x="720" y="254">[External System]</text>
          <text class="desc" x="720" y="288">Shows products to customers</text>
          <text class="demo" x="720" y="314">In this project: catalog-ui</text>
        </g>
        <!-- drawn around (0,0), the center of the opened boundary (360 x 240) -->
        <g id="webshop-inner" style="opacity:0">
          <g class="box app-link" data-app="catalog-ui" role="link" aria-label="Open catalog-ui">
            <rect class="fe-catalog" x="-140" y="-96" width="280" height="140" rx="14"/>
            <text class="name" x="0" y="-46">catalog-ui</text>
            <text class="kind" x="0" y="-22">[Container: Vue.js]</text>
            <text class="desc" x="0" y="8">The shop: search, live prices</text>
            <text class="open-app" x="0" y="32">Click to open ↗</text>
          </g>
          <text class="ext-boundary-name" x="-160" y="78">Webshop</text>
          <text class="boundary-kind" x="-160" y="100">[External System]</text>
        </g>
      </g>

      <!-- Product Catalog: a solid box at level 1, the system boundary at level 2 -->
      <g id="catalog">
        <rect id="catalog-rect" class="system" x="540" y="420" width="360" height="180" rx="14"/>
        <g id="catalog-l1">
          <text class="name" x="720" y="474" style="font-size:24px">Product Catalog</text>
          <text class="kind" x="720" y="499">[Software System]</text>
          <text class="desc" x="720" y="532">Stores products, syncs prices,</text>
          <text class="desc" x="720" y="554">full-text search</text>
          <text class="demo" x="720" y="582">In this project: catalog-service + PostgreSQL</text>
        </g>
        <g id="boundary-label" style="opacity:0">
          <text class="boundary-name" x="464" y="1162">Product Catalog</text>
          <text class="boundary-kind" x="464" y="1184">[Software System]</text>
        </g>
      </g>

      <!-- Containers inside the boundary (level 2) -->
      <g id="inner" style="opacity:0">
        <!-- catalog-service: a solid box at level 2, the boundary around its components at level 3 -->
        <g class="box">
          <rect id="svc-rect" class="container" x="550" y="640" width="340" height="180" rx="14"/>
          <g id="svc-l2">
            <text class="name" x="720" y="695">catalog-service</text>
            <text class="kind" x="720" y="719">[Container: Java 25, Spring Boot 4]</text>
            <text class="desc" x="720" y="752">REST API (OpenAPI),</text>
            <text class="desc" x="720" y="774">full-text search, price sync</text>
            <text class="prod-hint" x="720" y="805" data-href="production-diagram.html">In production: 3 copies ↗</text>
          </g>
        </g>

        <g id="db" class="box focusable" data-focus="db">
          <path class="container" d="M600,963 a120,18 0 0,1 240,0 v134 a120,18 0 0,1 -240,0 z"/>
          <path class="db-rim" d="M600,963 a120,18 0 0,0 240,0"/>
          <g class="l3-db-simple">
          <text class="name" x="720" y="1022">PostgreSQL</text>
          <text class="kind" x="720" y="1046">[Container: PostgreSQL 18]</text>
          <text class="desc" x="720" y="1076">Products, prices, search index</text>
          </g>
          <!-- level 4: the products table (V1__create_products.sql) -->
          <g class="l4-db">
            <rect class="db-table" x="614" y="985" width="212" height="112" rx="4"/>
            <rect class="db-head" x="614" y="985" width="212" height="12" rx="4"/>
            <rect class="db-head" x="614" y="991" width="212" height="6"/>
            <text class="db-name" x="619" y="994">products</text>
            <text class="db-meta" x="821" y="994" text-anchor="end">TABLE · POSTGRESQL 18</text>
            <text class="db-col" x="619" y="1006">sku</text>
            <text class="db-type" x="672" y="1006">varchar(64)</text>
            <text class="db-note" x="716" y="1006">PRIMARY KEY (natural key)</text>
            <text class="db-col" x="619" y="1015.2">name</text>
            <text class="db-type" x="672" y="1015.2">text</text>
            <text class="db-note" x="716" y="1015.2">NOT NULL</text>
            <text class="db-col" x="619" y="1024.4">description</text>
            <text class="db-type" x="672" y="1024.4">text</text>
            <text class="db-note" x="716" y="1024.4"></text>
            <text class="db-col" x="619" y="1033.6000000000001">brand</text>
            <text class="db-type" x="672" y="1033.6000000000001">text</text>
            <text class="db-note" x="716" y="1033.6000000000001"></text>
            <text class="db-col" x="619" y="1042.8000000000002">category</text>
            <text class="db-type" x="672" y="1042.8000000000002">text</text>
            <text class="db-note" x="716" y="1042.8000000000002"></text>
            <text class="db-col" x="619" y="1052.0000000000002">attributes</text>
            <text class="db-type" x="672" y="1052.0000000000002">jsonb</text>
            <text class="db-note" x="716" y="1052.0000000000002">NOT NULL · empty = {}</text>
            <text class="db-col" x="619" y="1061.2000000000003">(no id column)</text>
            <text class="db-type" x="672" y="1061.2000000000003">—</text>
            <text class="db-note" x="716" y="1061.2000000000003">decided: sku is the key</text>
            <text class="db-col" x="619" y="1070.4000000000003">price_amount, _updated_at</text>
            <text class="db-type" x="672" y="1070.4000000000003" style="visibility:hidden">-</text>
            <text class="db-note" x="716" y="1070.4000000000003">NULL until 1st sync · CHECK: both or none</text>
            <text class="db-col" x="619" y="1079.6000000000004">search_vector</text>
            <text class="db-type" x="672" y="1079.6000000000004">tsvector</text>
            <text class="db-note" x="716" y="1079.6000000000004">GENERATED (filled by postgres) · GIN index</text>
            <text class="ad-tag built-tag" x="619" y="1092">V1 TABLE · V2 SEARCH_VECTOR + GIN · V3 SHEDLOCK</text>
          </g>
        </g>

        <line id="rel-db" class="rel" marker-end="url(#arrow)"/>
        <g id="rel-db-label">
          <text class="rel-label" x="18" y="-6">Reads and writes</text>
          <text class="rel-tech" x="18" y="14">[JDBC]</text>
        </g>

        <!-- Level 3: the components inside catalog-service, drawn in their own units (1480 x 870)
             and scaled so they always fit the growing catalog-service box.
             Hexagonal: the core (application services around the domain) is a hexagon. The two real
             ports are sockets in its edge, and the outbound adapters plug into them. The inbound
             adapters call the application services directly (no inbound port, see ADR 0001). -->
        <g id="l3" style="opacity:0">
          <text class="boundary-name" x="1456" y="832" text-anchor="end">catalog-service</text>
          <text class="boundary-kind" x="1456" y="854" text-anchor="end">[Container: Java 25, Spring Boot 4]</text>

          <!-- the core -->

<script>
  (function () {
    // Five boxes can open: c = Product Catalog, p = PIM System, r = Price System, w = Webshop,
    // and s = catalog-service (level 3), which only opens once the Product Catalog is open.
    // t[part] runs from 0 (closed) to 1 (open); open[part] is where it's heading.
    const PARTS = ['c', 'p', 'r', 'w', 's'];
    const MIN = 0.2, MAX = 10, DOT = 24;
    const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    const $ = (id) => document.getElementById(id);
    const viewport = $('viewport');
    const scene = $('scene');

    let k = 1, x = 0, y = 0; // camera
    const t = { c: 0, p: 0, r: 0, w: 0, s: 0 };
    let open = { c: false, p: false, r: false, w: false, s: false };
    let transitioning = false;

    const lerp = (a, b, q) => a + (b - a) * q;
    const smooth = (e0, e1, v) => {
      const q = Math.min(Math.max((v - e0) / (e1 - e0), 0), 1);
      return q * q * (3 - 2 * q);
    };
    const easeInOut = (q) => (q < 0.5 ? 4 * q * q * q : 1 - Math.pow(-2 * q + 2, 3) / 2);
    const clampK = (v) => Math.min(Math.max(v, MIN), MAX);
    const lerpRect = (a, b, q) => ({
      x: lerp(a.x, b.x, q), y: lerp(a.y, b.y, q), w: lerp(a.w, b.w, q), h: lerp(a.h, b.h, q),
    });
    const grow = (r, m) => ({ x: r.x - m, y: r.y - m, w: r.w + 2 * m, h: r.h + 2 * m });
    const anyOpen = (o) => PARTS.some((part) => o[part]);

    // ---- layout ----------------------------------------------------------

    // The external boxes sit on the same line as catalog-service, which moves down 220 when the catalog opens.
    const rowY = (c) => 510 + 220 * c;

    // Level 3: catalog-service grows 4x, from its level-2 box to the 1480 x 870 component boundary.
    // The catalog grows around it, the PIM and Price System move SHIFT out to make room, and each
    // lines up with the component it talks to: PIM with the Web adapter, Price with the Price client.
    const SVC = { x: 550, y: 640, w: 340, h: 180 };
    const SVC_OPEN = { x: -20, y: 640, w: 1480, h: 870 };
    const SHIFT = 660;
    const DB_SHIFT = { x: -570, y: 635 }; // PostgreSQL moves under the Persistence adapter

    function geometry(s) {
      const ey = rowY(s.c);
      const pey = lerp(ey, 725, s.s), rey = lerp(ey, 1200, s.s);
      // cc: the catalog at level 1-2 size, which #inner is scaled into
      const cc = lerpRect({ x: 540, y: 420, w: 360, h: 180 }, { x: 440, y: 560, w: 560, h: 640 }, s.c);
      const p = lerpRect({ x: 20, y: pey - 80, w: 300, h: 160 }, { x: -80, y: pey - 150, w: 360, h: 300 }, s.p);
      const r = lerpRect({ x: 1120, y: rey - 80, w: 300, h: 160 }, { x: 1160, y: rey - 150, w: 360, h: 520 }, s.r);
      p.x -= SHIFT * s.s;
      r.x += SHIFT * s.s;
      return {
        ey, pey, rey, cc, p, r,
        c: lerpRect(cc, { x: -130, y: 560, w: 1700, h: 1275 }, s.s),
        w: lerpRect({ x: 570, y: 170, w: 300, h: 160 }, { x: 540, y: 80, w: 360, h: 240 }, s.w),
        // the catalog-service box, in #inner's units (the same as the scene once the catalog is open)
        s: lerpRect(SVC, SVC_OPEN, s.s),
      };
    }

    // #inner is drawn at level-2 size and scaled into the catalog box; this is that mapping.
    function innerMap(cc) {
      const m = Math.min(cc.w / 560, cc.h / 640);
      return { m, x: cc.x + cc.w / 2 - 720 * m, y: cc.y + cc.h / 2 - 880 * m };
    }
    const toScene = (r, im) => ({ x: im.x + r.x * im.m, y: im.y + r.y * im.m, w: r.w * im.m, h: r.h * im.m });

    function render() {
      const g = geometry(t);

      // Product Catalog: solid box -> blue system boundary with containers.
      const rect = $('catalog-rect');
      rect.setAttribute('x', g.c.x);
      rect.setAttribute('y', g.c.y);
      rect.setAttribute('width', g.c.w);
      rect.setAttribute('height', g.c.h);
      rect.style.fillOpacity = lerp(1, 0.06, smooth(0, 0.6, t.c));
      rect.style.strokeOpacity = smooth(0.1, 0.6, t.c);
      $('catalog-l1').style.opacity = 1 - smooth(0, 0.35, t.c);
      $('catalog-l1').setAttribute('transform', `translate(0 ${lerp(0, 180, t.c)})`);
      $('boundary-label').style.opacity = smooth(0.6, 1, t.c);
      $('boundary-label').setAttribute('transform', `translate(${g.c.x - 440} ${g.c.y + g.c.h - 1200})`);
      // The containers grow with the boundary, so they always fit inside it.
      const im = innerMap(g.cc);
      $('inner').style.opacity = smooth(0.3, 0.9, t.c);
      $('inner').setAttribute('transform', `translate(${im.x} ${im.y}) scale(${im.m})`);

      // catalog-service: solid box -> boundary with components, the same way the catalog opens.
      const svc = $('svc-rect');
      svc.setAttribute('x', g.s.x);
      svc.setAttribute('y', g.s.y);
      svc.setAttribute('width', g.s.w);
      svc.setAttribute('height', g.s.h);
      svc.style.fillOpacity = lerp(1, 0.06, smooth(0, 0.6, t.s));
      svc.style.strokeOpacity = smooth(0.1, 0.6, t.s);
      $('svc-l2').style.opacity = 1 - smooth(0, 0.35, t.s);
      $('svc-l2').setAttribute('transform',
        `translate(${g.s.x + g.s.w / 2 - 720} ${g.s.y + g.s.h / 2 - 730})`);
      $('l3').style.opacity = smooth(0.3, 0.9, t.s);
      $('l3').style.pointerEvents = t.s > 0.9 ? '' : 'none'; // invisible level 3 must not catch clicks at level 2
      $('l3').setAttribute('transform',
        `translate(${g.s.x + g.s.w / 2} ${g.s.y + g.s.h / 2}) scale(${Math.min(g.s.w / 1480, g.s.h / 870)}) translate(-740 -435)`);

      // PostgreSQL moves under the Persistence adapter; its arrow starts there.
      const dbx = DB_SHIFT.x * t.s, dby = DB_SHIFT.y * t.s;
      $('db').setAttribute('transform', `translate(${dbx} ${dby})`);
      const db1 = lerp(824, 1274, t.s), db2 = 939 + dby;
      $('rel-db').setAttribute('x1', 720 + dbx);
      $('rel-db').setAttribute('x2', 720 + dbx);
      $('rel-db').setAttribute('y1', db1);
      $('rel-db').setAttribute('y2', db2);
      $('rel-db-label').setAttribute('transform', `translate(${720 + dbx} ${(db1 + db2) / 2})`);

      // PIM, Price and Webshop: gray box -> gray boundary with what stands in for it.
      // PIM and Price sit on the catalog-service line, so their text moves down with it.
      const externals = [
        ['p', 'pim', { w: 360, h: 300 }, g.pey - 510],
        ['r', 'price', { w: 360, h: 520 }, g.rey - 510],
        ['w', 'webshop', { w: 360, h: 240 }, 0],
      ];
      for (const [part, id, size, dy] of externals) {
        const r = g[part], q = t[part];
        const box = $(id + '-rect');
        box.setAttribute('x', r.x);
        box.setAttribute('y', r.y);
        box.setAttribute('width', r.w);
        box.setAttribute('height', r.h);
        box.style.fillOpacity = lerp(1, 0.06, smooth(0, 0.6, q));
        box.style.strokeOpacity = smooth(0.1, 0.6, q);
        $(id + '-closed').style.opacity = 1 - smooth(0, 0.35, q);
        $(id + '-closed').setAttribute('transform', `translate(0 ${dy})`);
        $(id + '-inner').style.opacity = smooth(0.3, 0.9, q);
        $(id + '-inner').setAttribute('transform',
          `translate(${r.x + r.w / 2} ${r.y + r.h / 2}) scale(${Math.min(r.w / size.w, r.h / size.h)})`);
      }

      // Arrows follow the boxes they connect; labels stay in the middle of their arrow.
      // Shopper -> Webshop -> catalog (catalog-service once the catalog is open, the Web adapter at level 3).
      const vertical = [
        ['shopper', 2, g.w.y - 6],
        ['webshop', g.w.y + g.w.h + 4, lerp(lerp(414, 636, t.c), 654, t.s)],
      ];
      for (const [id, y1, y2] of vertical) {
        $('rel-' + id).setAttribute('y1', y1);
        $('rel-' + id).setAttribute('y2', y2);
        $('rel-' + id + '-label').setAttribute('transform', `translate(0 ${(y1 + y2) / 2})`);
      }

      // At level 3 these labels sit between the external system and the catalog boundary.
      const pim = $('rel-pim');
      const p1 = lerp(322, 244, t.p) - SHIFT * t.s, p2 = lerp(lerp(534, 546, t.c), 554, t.s);
      pim.setAttribute('x1', p1);
      pim.setAttribute('x2', p2);
      pim.setAttribute('y1', g.pey);
      pim.setAttribute('y2', g.pey);
      const pm = lerp((p1 + p2) / 2, (p1 + g.c.x) / 2, t.s);
      $('rel-pim-label').setAttribute('transform', `translate(${pm - 428} ${g.pey - 510})`);

      const price = $('rel-price');

    const FLOWS = [

            text: '<b>Before the app code runs.</b> Spring turns the query string into two numbers (defaults 0 and 20) and checks the limits. Out of range → <code>400</code>.' },

          rowsToEntities('Page<ProductEntity>'),
          pageToDomain(),
          backToController('product', 'ProductPage', 'Back to the controller', 'ProductService returns one page of domain products.'),
          controllerOut({ from: 'ProductPage', to: 'ProductPageDto' }, 'dto', D.listResponse,

              backToController('product', 'ProductPage', 'Back to the controller', 'ProductService returns one page of products.'),
