    ];

    // ---- packet, trails and spotlight ----
    const NS = 'http://www.w3.org/2000/svg';
    const layer = $('flow-layer');
    const trails = $('flow-trails');
    const trailNow = $('flow-trail-now');
    const ring = $('flow-ring');
    const packet = $('packet');
    const pill = $('packet-pill');
    const pillText = $('packet-text');
    const WHO = { 'app code': '#4ade80', framework: '#94a3b8', external: '#f59e0b', network: '#64748b', database: '#fb7185' };

    let flow = null;        // the open flow, or null
    let choices = {};       // fork id → the option picked, for the open flow
    let explored = new Set(); // 'forkId:optionId' already taken in this run
    let stepIndex = 0;
    let packetAnim = null, camAnim = null;
    let packetPos = [0, 0];

    function polyline(pts) {
      const segs = [];
      let total = 0;
      for (let i = 1; i < pts.length; i++) {
        const len = Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]);
        segs.push({ from: total, len });
        total += len;
      }
      const at = (d) => {
        if (pts.length === 1 || total === 0) return pts[0];
        d = Math.min(Math.max(d, 0), total);
        let i = segs.findIndex((s) => d <= s.from + s.len);
        if (i < 0) i = segs.length - 1;
        const q = segs[i].len ? (d - segs[i].from) / segs[i].len : 1;
        const a = pts[i], b = pts[i + 1];
        return [lerp(a[0], b[0], q), lerp(a[1], b[1], q)];
      };
      // distance at which the packet reaches waypoint i
      const reach = (i) => (i <= 0 ? 0 : i >= pts.length - 1 ? total : segs[i].from);
      return { total, at, reach, d: 'M' + pts.map((p) => p.join(',')).join(' L') };
    }

    function setWhere(where) {
      if (!where) return;
      const [name, who] = where;
      $('where-text').textContent = `${name} · ${who}`;
      const w = $('where-text').getComputedTextLength() + 30;
      $('where-pill').setAttribute('x', -w / 2);
      $('where-pill').setAttribute('width', w);
      $('where-dot').setAttribute('cx', -w / 2 + 12);
      $('where-text').setAttribute('x', 7);
      $('where-dot').style.fill = WHO[who];
      const row = document.querySelector('.step-where');
      if (row) {
        row.style.setProperty('--who', WHO[who]);
        row.querySelector('b').textContent = name;
        row.querySelector('span').textContent = who;
      }
    }

    function setPacket(label, kind, pop, where) {
      setWhere(where);
      const color = KINDS[kind].color;
      packet.style.setProperty('--kind', color);
      pillText.textContent = label;
      const w = pillText.getComputedTextLength() + 22;
      pill.setAttribute('x', -w / 2);
      pill.setAttribute('width', w);
      if (pop) {
        packet.classList.remove('pop');
        void packet.getBoundingClientRect(); // restart the animation
        packet.classList.add('pop');
      }
      const badge = document.querySelector('.step-type');
      if (badge) {
        badge.style.setProperty('--kind', color);
        badge.querySelector('b').textContent = label;
        badge.querySelector('span').textContent = KINDS[kind].name;
      }
    }

    function placePacket(p) {
      packetPos = p;
      packet.setAttribute('transform', `translate(${p[0]} ${p[1]}) scale(${1 / k})`);
    }

    // Packet, trails and ring keep the same size on screen at every zoom.
    function flowOnCamera() {
      if (!flow) return;
      placePacket(packetPos);
      trailNow.style.strokeWidth = 4 / k;
      trails.querySelectorAll('path').forEach((p) => { p.style.strokeWidth = 3 / k; });
      ring.style.strokeWidth = 3 / k;
      ring.setAttribute('rx', 16 / k);
    }

    // ---- camera ----
    const panel = $('flows');
    function freeArea() {
      const vw = viewport.clientWidth, vh = viewport.clientHeight;
      const top = document.querySelector('header.panel').getBoundingClientRect().bottom + 8;
      if (!panel.classList.contains('open')) return { x: 0, y: top, w: vw, h: vh - top };
      const r = panel.getBoundingClientRect();
      return r.top > vh * 0.3 ? { x: 0, y: top, w: vw, h: r.top - top - 16 } : { x: 0, y: top, w: r.left - 16, h: vh - top };
    }

    function flyTo(b, duration = 800) {
      cancelAnimationFrame(camAnim);
      const a = freeArea();
      const ax = a.x + a.w / 2, ay = a.y + a.h / 2;
      const to = { k: clampK(Math.min(a.w / b.w, a.h / b.h) * 0.9), cx: b.x + b.w / 2, cy: b.y + b.h / 2 };
      const from = { k, cx: (ax - x) / k, cy: (ay - y) / k };
      const start = performance.now();
      const d = reduceMotion ? 0 : duration;
      function frame() {
        const q = d ? Math.min(Math.max((performance.now() - start) / d, 0), 1) : 1;
        const e = easeInOut(q);
        k = from.k * Math.pow(to.k / from.k, e);
        x = ax - lerp(from.cx, to.cx, e) * k;
        y = ay - lerp(from.cy, to.cy, e) * k;
        apply();
        if (q < 1) camAnim = requestAnimationFrame(frame);
      }
      camAnim = requestAnimationFrame(frame);
    }
    viewport.addEventListener('pointerdown', () => cancelAnimationFrame(camAnim));
    viewport.addEventListener('wheel', () => cancelAnimationFrame(camAnim), { passive: true });

    function stepBounds(step) {
      const xs = step.path.map((p) => p[0]), ys = step.path.map((p) => p[1]);
      const n = NODES[step.at];
      let x0 = Math.min(...xs, n.x), x1 = Math.max(...xs, n.x + n.w);
      let y0 = Math.min(...ys, n.y), y1 = Math.max(...ys, n.y + n.h);
      const close = step.at.startsWith('svc'); // zoom in closer on a service
      const inside = ['persist', 'priceClient', 'web'].includes(step.at); // and closer still inside an adapter
      const pad = inside ? 60 : close ? 110 : 150;
      const minW = inside ? 480 : close ? 760 : 1000, minH = inside ? 300 : close ? 480 : 640;
      const cx = (x0 + x1) / 2, cy = (y0 + y1) / 2;
      const w = Math.max(x1 - x0 + 2 * pad, minW), h = Math.max(y1 - y0 + 2 * pad, minH);
      return { x: cx - w / 2, y: cy - h / 2, w, h };
    }
    function frameStep() { if (flow) flyTo(stepBounds(flow.steps[stepIndex]), 500); }

    // ---- running a step ----
    function drawPastTrails() {
      trails.replaceChildren();
      for (let i = 0; i < stepIndex; i++) {
        const p = document.createElementNS(NS, 'path');
        p.setAttribute('d', polyline(flow.steps[i].path).d);
        trails.appendChild(p);
      }
    }

    function spotlight(name) {
      const n = NODES[name];
      ring.setAttribute('x', n.x - 10);
      ring.setAttribute('y', n.y - 10);
      ring.setAttribute('width', n.w + 20);
      ring.setAttribute('height', n.h + 20);
      ring.classList.remove('show');
      void ring.getBoundingClientRect();
      ring.classList.add('show');
    }

    // The steps of the chosen path: a fork ends the list until an option is picked.
    function resolve(steps) {
      const out = [];
      for (const s of steps) {
        out.push(s);
        if (s.fork) {
          const opt = s.fork.options.find((o) => o.id === choices[s.fork.id]);
          if (opt) out.push(...resolve(opt.steps));
          break;
        }
      }
      return out;
    }
    const countForks = (steps) => steps.reduce((n, s) =>
      n + (s.fork ? 1 + s.fork.options.reduce((m, o) => m + countForks(o.steps), 0) : 0), 0);

    function choose(optId, at = stepIndex) {
      const step = flow.steps[at];
      if (!step.fork) return;
      choices[step.fork.id] = optId;
      explored.add(`${step.fork.id}:${optId}`);
      flow.steps = resolve(flow.tree);
      runStep(at + 1);
    }

    // At the end of a branch: the closest fork on this path that still has an untaken option.
    function nextUnexplored() {
      for (let i = flow.steps.length - 1; i >= 0; i--) {
        const f = flow.steps[i].fork;
        const opt = f && f.options.find((o) => !explored.has(`${f.id}:${o.id}`));
        if (opt) return { index: i, opt, fork: f };
      }
      return null;
    }
    // Next at the end of a branch: first the other options, then the next flow.
    function afterBranch() {
      const other = nextUnexplored();
      if (other) choose(other.opt.id, other.index);
      else if (flow.next) startFlow(flow.next);
    }

    function runStep(i) {
      if (!flow) return;
      closeDetail(true);
      stepIndex = Math.min(Math.max(i, 0), flow.steps.length - 1);
      const step = flow.steps[stepIndex];
      cancelAnimationFrame(packetAnim);
      layer.style.setProperty('--flow', flow.color);
      updateHint();
      drawPastTrails();
      renderPanel();
      spotlight(step.at);
      flyTo(stepBounds(step));

      const line = polyline(step.path);
      const morphs = (step.morph || []).map(([wp, label, kind, where]) => ({ d: line.reach(wp), label, kind, where, done: false }));
      if (step.fork) morphs.push({ d: line.total, label: step.fork.short, kind: 'choice', done: false }); // the packet asks the question
      setPacket(step.label, step.kind, true, step.where);
      placePacket(line.at(0));
      trailNow.setAttribute('d', line.d);
      trailNow.style.strokeDasharray = `${line.total} ${line.total + 1}`;
      trailNow.style.strokeDashoffset = line.total;
      flowOnCamera();

      const duration = reduceMotion ? 0 : Math.min(Math.max(600 + line.total * 0.9, 900), 3200);
      const start = performance.now() + (reduceMotion ? 0 : 250); // let the camera start first
      function frame() {
        const q = duration ? Math.min(Math.max((performance.now() - start) / duration, 0), 1) : 1;
        const dist = line.total * easeInOut(q);
        placePacket(line.at(dist));
        trailNow.style.strokeDashoffset = line.total - dist;
        for (const m of morphs) {
          if (!m.done && dist >= m.d - 0.5) { m.done = true; setPacket(m.label, m.kind, m.label !== pillText.textContent || !m.where, m.where); }
        }
        if (q < 1) packetAnim = requestAnimationFrame(frame);
      }
      packetAnim = requestAnimationFrame(frame);
    }

    // ---- panel ----
    const kindsLegend = () => Object.entries(KINDS).map(([, v]) =>
      `<span class="kind-dot" style="--kind:${v.color}"></span>${v.name}`).join('');
    const chips = (list) => (list || []).map((c) =>
      `<span class="chip">${esc(c)}</span>`).join('');

    function renderList() {
      $('flows-body').innerHTML = `
        <p class="flows-intro">Pick a request and follow it through the system, step by step. The packet's label is its type right now, showing where the mapping happens.</p>
        <div class="flow-cards">
          ${FLOWS.map((f) => `
            <button class="flow-card" data-flow="${f.id}" style="--flow:${f.color}">
              <span class="flow-card-top"><b>${f.name}</b><span class="flow-steps">${countForks(f.tree || f.steps)
                ? `◆ ${countForks(f.tree || f.steps)} choice${countForks(f.tree || f.steps) > 1 ? 's' : ''}` : `${f.steps.length} steps`}</span></span>
              <span class="flow-card-desc">${f.desc}</span>
              <span class="chips">${chips(f.chips)}</span>
            </button>`).join('')}
        </div>
        <div class="kinds">${kindsLegend()}</div>`;
      $('flows-body').querySelectorAll('.flow-card').forEach((b) =>
        b.addEventListener('click', () => startFlow(b.dataset.flow)));
      $('flows-title').textContent = 'Flows';
      $('flows-back').hidden = true;
    }

    function renderPanel() {
      const step = flow.steps[stepIndex];
      const last = stepIndex === flow.steps.length - 1;
      const end = flow.steps[flow.steps.length - 1];
      const waiting = end.fork && !choices[end.fork.id]; // the path still waits for a choice
      const other = last && !step.fork && nextUnexplored(); // an option of this flow not seen yet
      const forkBox = step.fork ? `
          <div class="fork-q" id="fork">
            <h3><i>◆</i>${esc(step.fork.question)}</h3>
            <div class="fork-opts">${step.fork.options.map((o, n) => `
              <button class="fork-opt${choices[step.fork.id] === o.id ? ' chosen' : ''}" data-opt="${o.id}">
                <kbd>${n + 1}</kbd><b>${esc(o.label)}</b><span>${esc(o.hint)}</span>
              </button>`).join('')}</div>
          </div>` : '';
      const next = flow.next && FLOWS.find((f) => f.id === flow.next);
      $('flows-title').textContent = flow.name;
      $('flows-back').hidden = false;
      panel.style.setProperty('--flow', flow.color);
      $('flows-body').innerHTML = `
        <div class="progress">${flow.steps.map((_, i) =>
          `<button class="seg${i < stepIndex ? ' done' : ''}${i === stepIndex ? ' now' : ''}" data-step="${i}" aria-label="Step ${i + 1}"></button>`).join('')}${waiting ? '<span class="seg pending"></span>' : ''}</div>
        <article class="step-card">
          <div class="step-num">Step ${stepIndex + 1}${waiting ? '' : ` of ${flow.steps.length}`}${step.fork ? ' · <span class="fork-tag">◆ choice</span>' : ''}</div>
          <h2>${step.title}</h2>
          <p>${step.text}</p>
          ${step.chips ? `<div class="chips">${chips(step.chips)}</div>` : ''}
          <div class="step-type" style="--kind:${KINDS[step.kind].color}"><i></i><b>${esc(step.label)}</b><span>${KINDS[step.kind].name}</span></div>
          ${step.where ? `<div class="step-where" style="--who:${WHO[step.where[1]]}"><i></i><b>${esc(step.where[0])}</b><span>${step.where[1]}</span></div>` : ''}
          ${step.detail ? `<button class="zoom-btn" id="zoom-step">
              <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="8.5" cy="8.5" r="5.5"/><path d="M13 13l4.5 4.5M8.5 6v5M6 8.5h5"/></svg>
              Zoom in: ${esc(step.detail.title)}
            </button>` : ''}
          ${forkBox}
        </article>
        <div class="controls">
          <button class="ctl" id="step-prev" ${stepIndex === 0 ? 'disabled' : ''} aria-label="Previous step">←</button>
          <button class="ctl" id="step-replay" aria-label="Replay step">↻</button>
          ${step.fork
            ? `<button class="ctl primary" id="step-choose" ${choices[step.fork.id] ? '' : 'disabled'}>${choices[step.fork.id] ? 'Next →' : 'Pick an option ↑'}</button>`
            : last && other
            ? `<button class="ctl primary" id="step-other" title="Back to “${esc(other.fork.question)}”">◆ Other option: ${esc(other.opt.label)} →</button>`
            : last
            ? (next ? `<button class="ctl primary" id="step-nextflow">Next flow: ${next.name} →</button>`
                    : `<button class="ctl primary" id="step-done">Close</button>`)
            : `<button class="ctl primary" id="step-next">Next →</button>`}
        </div>
        <ol class="step-list">${flow.steps.map((s, i) => {
          const picked = s.fork && s.fork.options.find((o) => o.id === choices[s.fork.id]);
          return `<li class="${i < stepIndex ? 'done' : ''}${i === stepIndex ? ' now' : ''}${s.fork ? ' fork' : ''}" data-step="${i}"><span>${i + 1}</span>${s.title}${
            s.fork ? `<em class="fork-chip">◆ ${picked ? esc(picked.label) : 'choose'}</em>` : ''}${s.detail ? '<i class="has-zoom" title="Has a zoom-in"></i>' : ''}</li>`;
        }).join('')}${waiting ? '<li class="pending">… the rest depends on the choice</li>' : ''}</ol>
        <div class="kinds">${kindsLegend()}</div>`;
      const body = $('flows-body');
      body.querySelectorAll('[data-step]').forEach((el) => el.addEventListener('click', () => runStep(+el.dataset.step)));
      $('step-prev')?.addEventListener('click', () => runStep(stepIndex - 1));
      $('step-replay').addEventListener('click', () => runStep(stepIndex));
      $('step-next')?.addEventListener('click', () => runStep(stepIndex + 1));
      $('step-choose')?.addEventListener('click', () => choose(choices[step.fork.id]));
      body.querySelectorAll('[data-opt]').forEach((el) => el.addEventListener('click', () => choose(el.dataset.opt)));
      $('step-nextflow')?.addEventListener('click', () => startFlow(flow.next));
      $('step-other')?.addEventListener('click', () => choose(other.opt.id, other.index));
      $('step-done')?.addEventListener('click', () => { flow = null; showFlowLayer(false); renderList(); flyTo(L3_BOUNDS, 700); updateHint(); });
      $('zoom-step')?.addEventListener('click', openDetail);
      body.scrollTop = 0;
    }

    function showFlowLayer(on) {
      layer.classList.toggle('on', on);
      $('l3').classList.toggle('flow-app', on); // the services are visible during a flow
      scene.classList.toggle('flow-app', on);
      if (!on) { cancelAnimationFrame(packetAnim); trails.replaceChildren(); }
    }

    function updateHint() {
      $('level-hint').textContent = flow
        ? '→ or Space: next step · 1–3: pick at a ◆ choice · ←: back · Z: zoom in · Esc: leave the flow'
        : $('level-hint').textContent;
      if (!flow) updateUi();
    }

    function openPanel() {
      panel.classList.add('open');
      $('flows-btn').setAttribute('aria-pressed', 'true');
      if (!flow) renderList();
    }

    function closePanel() {
      exitFlow();
      panel.classList.remove('open');
      $('flows-btn').setAttribute('aria-pressed', 'false');
    }

    function startFlow(id) {
      const f = FLOWS.find((fl) => fl.id === id);
      if (!f) return;
      exitFocus(true);
      openPanel();
      flow = f;
      flow.tree = flow.tree || flow.steps;
      choices = {};
      explored = new Set();
      flow.steps = resolve(flow.tree);
      stepIndex = 0;
      showFlowLayer(true);
      updateHint();
      // Flows run at level 3; open it first if needed.
      const go = () => (transitioning ? requestAnimationFrame(go) : flow === f && runStep(0));
      if (!open.s) openPart('s');
      go();
    }

    function exitFlow() {
      if (!flow) return;
      flow = null;
      closeDetail(true);
      showFlowLayer(false);
      if (panel.classList.contains('open')) renderList();
      updateHint();
    }

    // ---- zoom-in on a step ----
    const detail = $('detail');
    // The card grows out of a point on screen: the packet, or the model that was clicked.
    let detailFromStep = false;
    function showCard({ eyebrow, title, source, html, color }, sx, sy) {
      $('detail-step').textContent = eyebrow;
      $('detail-title').textContent = title;
      $('detail-source').textContent = source === '—' ? '' : `From ${source}`;
      $('detail-body').innerHTML = html;
      detail.style.setProperty('--flow', color);
      const card = $('detail-card');
      detail.hidden = false;
      card.scrollTop = 0;
      const left = (window.innerWidth - card.offsetWidth) / 2, top = (window.innerHeight - card.offsetHeight) / 2;
      card.style.transformOrigin = `${sx - left}px ${sy - top}px`;
      requestAnimationFrame(() => detail.classList.add('open'));
    }

    function openDetail() {
      const step = flow && flow.steps[stepIndex];
      if (!step || !step.detail) return;
      detailFromStep = true;
      showCard({ eyebrow: `${flow.name} · step ${stepIndex + 1}`, title: step.detail.title, source: step.detail.source,
        html: step.detail.html, color: flow.color }, x + packetPos[0] * k, y + packetPos[1] * k);
      flyTo(grow(NODES[step.at], 60), 600); // the camera dives toward the packet
    }

    function openModel(id, sx, sy) {
      const m = MODELS[id];
      detailFromStep = false;
      showCard({ eyebrow: `Domain model · ${m.kind}`, title: m.title, source: m.source, html: m.html, color: '#38bdf8' }, sx, sy);
    }

    function closeDetail(instant) {
      if (detail.hidden) return;
      detail.classList.remove('open');
      if (instant || reduceMotion) detail.hidden = true;
      else setTimeout(() => { if (!detail.classList.contains('open')) detail.hidden = true; }, 260);
      if (!instant && detailFromStep) frameStep();
    }

    // ---- the three frontends open in a new tab ----
    // Docker (docker compose up) first, then the Vite dev server (npm run dev).
    const APPS = {
      'catalog-ui': ['http://localhost:3000', 'http://localhost:5173'],
      'fake-pim': ['http://localhost:3001', 'http://localhost:5174'],
      'fake-price-ui': ['http://localhost:3002', 'http://localhost:5175'],
    };
    // Only once its system is open, so a click on a closed system still opens the system.
    function appAt(sx, sy) {
      const el = document.elementFromPoint(sx, sy)?.closest('[data-app]');
      if (!el) return null;
      const inner = el.closest('[id$="-inner"]');
      return inner && parseFloat(inner.style.opacity) > 0.9 ? el.dataset.app : null;
    }
    const answers = (url) => fetch(url, { mode: 'no-cors', cache: 'no-store', signal: AbortSignal.timeout(1500) })
      .then(() => true, () => false);

    async function openApp(id) {
      // Open the tab right away, inside the click, so the browser doesn't block it as a popup.
      const tab = window.open('', '_blank');
      for (const url of APPS[id]) {
        if (await answers(url)) {
          if (tab) tab.location.href = url; else window.open(url, '_blank');
          return;
        }
      }
      tab?.close();
      const [docker, dev] = APPS[id];
      toast(`<b>${id}</b> isn't running. Start it with <code>docker compose up</code> (<a href="${docker}" target="_blank" rel="noopener">${docker.slice(7)}</a>) or <code>npm run dev</code> (<a href="${dev}" target="_blank" rel="noopener">${dev.slice(7)}</a>).`);
    }

    let toastTimer = null;
    function toast(html) {
      const el = $('toast');
      el.innerHTML = html;
      el.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => el.classList.remove('show'), 6000);
    }

    // ---- level 4: zoom into the Domain or the Application services ----
    let zoom4 = null;
    let codeAll = false; // "4 · Code": every box shows its inside at once
    function setCodeAll(on) {
      codeAll = on;
      $('l3').classList.toggle('f-all', on);
      scene.classList.toggle('f-all', on);
      updateUi();
    }
    const FOCUS = {
      domain: { x: 570, y: 1045, w: 300, h: 335 }, app: { x: 410, y: 835, w: 620, h: 510 },
      // adapters: the same framing as a flow step, so the neighbours stay in view
      web: { x: 220, y: 405, w: 1000, h: 640 }, persist: { x: -350, y: 880, w: 1000, h: 640 }, pclient: { x: 790, y: 880, w: 1000, h: 640 },
      fps: { x: 1500, y: 880, w: 1000, h: 640 }, db: { x: 0, y: 0, w: 1, h: 1 }, // both measured, see focusBox
    };
    const FOCUS_NAME = { domain: 'Domain', app: 'Application services', web: 'Web adapter', persist: 'Persistence adapter', pclient: 'Price client', fps: 'fake-price-service (external, simplified)', db: 'PostgreSQL: the products table' };
    const FOCUS_CLASSES = Object.keys(FOCUS).map((id) => 'f-' + id);
    // The model cards sit on top of the Domain, so they count as the Domain too.
    function focusAt(sx, sy) {
      const el = document.elementFromPoint(sx, sy);
      if (el?.closest('[data-model]')) return 'domain';
      return el?.closest('[data-focus]')?.dataset.focus;
    }
    // fake-price-service can be opened wherever it shows as a container (level 2 and 3);
    // the rest lives inside catalog-service, so only at level 3.
    function canFocus(id) {
      if (transitioning) return false;
      if (id === 'fps') return open.r && t.r > 0.9;
      if (id === 'db') return open.c && t.c > 0.9;
      return open.s && t.s > 0.9;
    }
    // fake-price-service moves between level 2 and 3, so its framing is measured from where it is now.
    const MEASURED = { fps: { sel: '[data-focus="fps"] rect.container', w: 1000, h: 640 }, db: { sel: '#db path.container', w: 600, h: 390 } };
    function focusBox(id) {
      const m = MEASURED[id];
      if (!m) return FOCUS[id];
      const r = document.querySelector(m.sel).getBoundingClientRect();
      const cx = (r.x + r.width / 2 - x) / k, cy = (r.y + r.height / 2 - y) / k;
      return { x: cx - m.w / 2, y: cy - m.h / 2, w: m.w, h: m.h };
    }

    function enterFocus(id) {
      if (flow || zoom4 === id) return;
      zoom4 = id;
      $('l3').classList.remove(...FOCUS_CLASSES);
      $('l3').classList.add('f-' + id);
      scene.classList.remove(...FOCUS_CLASSES);
      scene.classList.add('f-' + id);
      flyTo(focusBox(id), 800);
      $('level-hint').textContent = `Level 4 · code: ${FOCUS_NAME[id]} · Esc or click outside to go back`;
    }
    function exitFocus(noCamera) {
      if (!zoom4) return;
      zoom4 = null;
      $('l3').classList.remove(...FOCUS_CLASSES);
      scene.classList.remove(...FOCUS_CLASSES);
      if (!noCamera) flyTo(open.s ? L3_BOUNDS : overallBounds(open), 700);
      updateUi();
    }

    // ---- domain models ----
    const fields = (rows) => `<div class="d-fields">${rows.map(([n, type, rule]) =>
      `<div class="d-field"><code>${n}</code><code class="t">${esc(type)}</code><span>${rule}</span></div>`).join('')}</div>`;
    const tests = (file, names) => `<div class="d-h">Proven by ${file}</div><ul class="d-tests">${names.map((n) => `<li>${n}</li>`).join('')}</ul>`;
    const h = (v) => `<div class="d-h">${v}</div>`;

    const MODELS = {
      product: {
        title: 'Product', kind: 'entity', source: 'Product.java · ProductTest.java',
        html: note('An <b>entity</b>: it has an identity (<code>sku</code>, which never changes) and its details change over time. There are no setters: it only changes through its own methods, and they check the rules every time.') +
          h('Fields') + fields([
            ['sku', 'String', 'required · 1–64 letters, digits or dashes · final'],
            ['name', 'String', 'required · not blank'],
            ['description', 'String', 'optional'],
            ['brand', 'String', 'optional'],
            ['category', 'String', 'optional'],
            ['attributes', 'Map<String, Object>', 'flat: each value is text, a number or true/false · empty if none · read-only copy'],
            ['price', 'Price', 'optional, 0..1 · <code>getPrice()</code> returns <code>Optional&lt;Price&gt;</code> · only set by <code>applyPrice</code>'],
          ]) +
          h('How it changes') + code(`Product.create(sku, name, description, brand, category, attributes)
    // a new product, no price yet

new Product(sku, name, description, brand, category, attributes, price)
    // rebuild one that has a price, e.g. read from the database

product.replaceDetails(name, description, brand, category, attributes)
    // replace every detail, keep the price (PUT is create or replace)

product.applyPrice(newPrice)   → boolean
    // only if newer than the current price; false if ignored`) +
          h('Rules') + rules([
            'A product never exists in an invalid state: the constructor and <code>replaceDetails</code> check everything.',
            'Product data never touches the price, and the price sync never touches product data.',
            'An older or equal price is ignored, so the sync is safe to repeat.',
          ]) +
          tests('ProductTest', ['invalidSku_throws', 'blankName_throws', 'nestedAttributeValue_throws', 'replaceDetails_keepsPrice',
            'applyPrice_appliesWhenNoPriceYet', 'applyPrice_appliesWhenNewer', 'applyPrice_ignoresWhenEqualOrOlder']),
      },
      price: {
        title: 'Price', kind: 'value object', source: 'Price.java · PriceTest.java',
        html: note('A <b>value object</b>: a Java record, so it\'s immutable and two prices with the same values are equal. It has no identity of its own; it belongs to a <code>Product</code>.') +
          h('Fields') + fields([
            ['amount', 'BigDecimal', 'required · greater than 0 · at most 2 decimals · always stored with exactly 2 (89.9 → 89.90)'],
            ['updatedAt', 'Instant', 'required · when the price system changed this price · cut to microseconds (what PostgreSQL stores)'],
          ]) +
          h('Behavior') + code(`price.isNewerThan(other)   → boolean
    // true only if updatedAt is strictly later`) +
          h('Rules') + rules([
            'No currency field: EUR only, as in both contracts (<code>currency: [EUR]</code>).',
            'Because the amount always has 2 decimals, 89.9 and 89.90 are the same <code>Price</code>.',
            'An invalid price can\'t be created, so the core never has to check one.',
            '<b>Composition</b> (filled diamond in the diagram): a <code>Price</code> only exists inside its <code>Product</code>. A product has 0..1 price; a price belongs to exactly 1 product.',
          ]) +
          tests('PriceTest', ['validPrice_isCreatedWithTwoDecimals', 'zeroOrNegativeAmount_throws', 'moreThanTwoDecimals_throws',
            'isNewerThan_onlyWhenLaterAndNotEqual', 'isNewerThan_ignoresDifferenceBelowMicroseconds']),
      },
    };
    // Keyboard: Enter or Space on a focused model card opens it.
    document.querySelectorAll('[data-model]').forEach((el) => el.addEventListener('keydown', (e) => {
      if (e.key !== 'Enter' && e.key !== ' ') return;
      e.preventDefault();
      e.stopPropagation();
      const r = el.getBoundingClientRect();
      openModel(el.dataset.model, r.left + r.width / 2, r.top + r.height / 2);
    }));
    $('detail-close').addEventListener('click', () => closeDetail());
    detail.addEventListener('click', (e) => { if (e.target === detail) closeDetail(); });

    function flowKey(e) {
      if (!detail.hidden) {
        if (e.key === 'Escape' || e.key === 'z' || e.key === 'Z') { e.preventDefault(); closeDetail(); }
        return true;
      }
      if (zoom4 && e.key === 'Escape') { exitFocus(); return true; }
      if (zoom4 && ['1', '2', '3', '4'].includes(e.key)) exitFocus(true);
      if (codeAll && ['1', '2', '3'].includes(e.key)) setCodeAll(false);
      if (!flow) {
        if (e.key === 'f' || e.key === 'F') { panel.classList.contains('open') ? closePanel() : openPanel(); return true; }
        return false;
      }
      const atFork = flow.steps[stepIndex].fork;
      if (atFork && ['1', '2', '3'].includes(e.key) && atFork.options[+e.key - 1]) { choose(atFork.options[+e.key - 1].id); return true; }
      if (atFork && !choices[atFork.id] && (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'Enter')) {
        e.preventDefault();
        const box = $('fork');
        box?.classList.remove('nudge'); void box?.offsetWidth; box?.classList.add('nudge');
        return true;
      }
      if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'Enter') {
        e.preventDefault();
        if (stepIndex < flow.steps.length - 1) runStep(stepIndex + 1);
        else afterBranch();
        return true;
      }
      if (e.key === 'ArrowLeft') { e.preventDefault(); runStep(stepIndex - 1); return true; }
      if (e.key === 'z' || e.key === 'Z') { openDetail(); return true; }
      if (e.key === 'Escape') { exitFlow(); flyTo(L3_BOUNDS, 700); return true; }
      if (['1', '2', '3', '4'].includes(e.key)) exitFlow(); // then change level as usual
      return false;
    }

    $('flows-btn').addEventListener('click', () => (panel.classList.contains('open') ? closePanel() : openPanel()));
    $('flows-close').addEventListener('click', closePanel);
    $('flows-back').addEventListener('click', () => { exitFlow(); flyTo(L3_BOUNDS, 700); });


    render();
    updateUi();
    fit();
    // Linked from the production view: open straight at catalog-service's components.
    if (location.hash === '#components') requestAnimationFrame(openComponents);
  })();
</script>
</body>
</html>
