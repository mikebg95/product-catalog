<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Production View</title>
<style>
  :root {
    --bg: #f6f7f9;
    --dot: #d9dde3;
    --text: #1d2330;
    --muted: #5b6475;
    --line: #6b7385;
    --panel: rgba(255, 255, 255, 0.92);
    --panel-border: #dfe3ea;
    --active: #1168bd;
    --person: #08427b;
    --ours: #438dd5;
    --other: #8a8f98;
    --infra: #4b5a70;
    --zone: #8a8f98;
    --zone-ours: #1168bd;
    --zone-text: #5d636d;
    --zone-ours-text: #0b4f94;
    --on-box: #ffffff;
    --on-box-muted: rgba(255, 255, 255, 0.8);
    --card: #ffffff;
    --card-solid: #ffffff;
    --chip-bg: #eef1f5;
    --code-bg: #0f172a;
    --code-text: #e2e8f0;
    --todo-text: #b45309;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #13161c;
      --dot: #262b35;
      --text: #e7eaf0;
      --muted: #9aa3b5;
      --line: #8c95a8;
      --panel: rgba(28, 32, 40, 0.92);
      --panel-border: #2d3340;
      --active: #2a7fd4;
      --person: #0d4f91;
      --ours: #3a82c9;
      --other: #5e636c;
      --infra: #3d4a5e;
      --zone: #5e636c;
      --zone-ours: #2a7fd4;
      --zone-text: #aab0ba;
      --zone-ours-text: #8cbcf0;
      --card: rgba(255, 255, 255, 0.04);
      --card-solid: #1a1f29;
      --chip-bg: #262c38;
      --code-bg: #0b0e14;
      --todo-text: #fbbf24;
    }
  }
  :root[data-theme="dark"] {
    --bg: #13161c; --dot: #262b35; --text: #e7eaf0; --muted: #9aa3b5; --line: #8c95a8;
    --panel: rgba(28, 32, 40, 0.92); --panel-border: #2d3340; --active: #2a7fd4; --person: #0d4f91;
    --ours: #3a82c9; --other: #5e636c; --infra: #3d4a5e; --zone: #5e636c; --zone-ours: #2a7fd4;
    --zone-text: #aab0ba; --zone-ours-text: #8cbcf0; --card: rgba(255, 255, 255, 0.04); --card-solid: #1a1f29;
    --chip-bg: #262c38; --code-bg: #0b0e14; --todo-text: #fbbf24;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--text); overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, Helvetica, Arial, sans-serif;
  }
  [hidden] { display: none !important; }

  #viewport {
    position: fixed; inset: 0; cursor: grab; touch-action: none;
    background-image: radial-gradient(var(--dot) 1.2px, transparent 1.2px);
  }
  #viewport.dragging { cursor: grabbing; }
  svg { width: 100%; height: 100%; display: block; user-select: none; }

  .panel {
    position: fixed; background: var(--panel); border: 1px solid var(--panel-border); border-radius: 10px;
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  }
  header.panel {
    top: 16px; left: 16px; max-width: calc(100% - 32px); padding: 8px 8px 8px 14px;
    display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px;
  }
  header h1 { margin: 0; font-size: 15px; font-weight: 650; }
  .hypo {
    font-size: 11px; font-weight: 800; letter-spacing: 0.06em; padding: 3px 8px; border-radius: 6px;
    color: var(--todo-text); background: rgba(245, 158, 11, 0.16);
  }
  .link-btn {
    display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 8px;
    font-size: 12px; font-weight: 650; color: var(--muted); text-decoration: none; background: var(--chip-bg);
  }
  .link-btn:hover { color: var(--text); }
  .sc-btn {
    display: inline-flex; align-items: center; gap: 6px; border: 0; border-radius: 8px; padding: 6px 12px 6px 10px;
    font: inherit; font-size: 12px; font-weight: 700; color: #fff; cursor: pointer;
    background: linear-gradient(135deg, #3b82f6, #8b5cf6 55%, #ec4899);
    box-shadow: 0 4px 14px rgba(139, 92, 246, 0.35); transition: transform 0.15s;
  }
  .sc-btn:hover { transform: translateY(-1px); }
  .sc-btn[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px #8b5cf6; }
  .sc-btn svg { width: 12px; height: 12px; fill: currentColor; }

  .toolbar { bottom: 16px; right: 16px; display: flex; align-items: center; padding: 4px; gap: 2px; }
  .toolbar button {
    width: 32px; height: 32px; border: 0; border-radius: 7px; background: transparent; color: var(--text);
    font-size: 18px; line-height: 1; cursor: pointer;
  }
  .toolbar button:hover { background: var(--panel-border); }
  .toolbar button.fit { width: auto; padding: 0 10px; font-size: 12px; font-weight: 600; }
  .toolbar .zoom { min-width: 46px; text-align: center; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .hint { bottom: 16px; left: 16px; padding: 8px 12px; font-size: 12px; color: var(--muted); max-width: calc(100% - 220px); line-height: 1.5; }
  .hint strong { color: var(--text); font-weight: 600; }
  @media (max-width: 560px) { .hint { display: none; } }

  /* diagram */
  .person { fill: var(--person); }
  .ours { fill: var(--ours); }
  .other { fill: var(--other); }
  .infra { fill: var(--infra); }
  .name { fill: var(--on-box); font-size: 20px; font-weight: 700; text-anchor: middle; }
  .kind { fill: var(--on-box-muted); font-size: 12.5px; text-anchor: middle; }
  .desc { fill: var(--on-box); font-size: 13.5px; text-anchor: middle; }
  .zone-rect { fill: none; stroke: var(--zone); stroke-width: 2; stroke-dasharray: 10 6; }
  .zone-rect.ours-zone { stroke: var(--zone-ours); fill: var(--zone-ours); fill-opacity: 0.06; }
  .zone-name { fill: var(--zone-text); font-size: 15px; font-weight: 700; }
  .zone-name.ours-zone { fill: var(--zone-ours-text); }
  .zone-kind { fill: var(--muted); font-size: 12px; }
  .badge-bg { fill: rgba(0, 0, 0, 0.22); }
  .badge-bg.good { fill: rgba(34, 197, 94, 0.3); }
  .badge-bg.key { fill: rgba(250, 204, 21, 0.32); }
  .badge-text { fill: var(--on-box); font-size: 11px; font-weight: 700; text-anchor: middle; }
  .dep-frame { fill: var(--ours); fill-opacity: 0.1; stroke: var(--ours); stroke-width: 2.5; }
  .frame-name { fill: var(--zone-ours-text); font-size: 15px; font-weight: 700; }
  .frame-kind { fill: var(--muted); font-size: 12px; }
  .rel { stroke: var(--line); stroke-width: 2; fill: none; stroke-dasharray: 7 5; }
  .arrowhead { fill: var(--line); }
  .rel-label { fill: var(--text); font-size: 13.5px; font-weight: 600; }
  .rel-tech { fill: var(--muted); font-size: 12px; }
  .rel-label, .rel-tech { paint-order: stroke; stroke: var(--bg); stroke-width: 6px; stroke-linejoin: round; }
  .legend-text { fill: var(--muted); font-size: 13px; }
  .el { cursor: pointer; }
  .el .shape { transition: filter 0.15s, stroke 0.2s; }
  .el:hover .shape { filter: brightness(1.08); }

  /* scenario highlighting */
  .el, .edge { transition: opacity 0.35s; }
  #scene.dimmed .el:not(.hl), #scene.dimmed .edge:not(.hl) { opacity: 0.16; }
  .el.hl .shape { stroke: var(--sc); stroke-width: 4; filter: drop-shadow(0 0 10px var(--sc)); }
  /* flows: a packet that travels along the arrows, like the C4 model */
  .trail { fill: none; stroke: var(--sc); stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; opacity: 0.35; }
  .trail.now { opacity: 0.95; }
  .pk-core { fill: var(--kind); stroke: #fff; stroke-width: 3; }
  .pk-glow { fill: var(--kind); opacity: 0.3; transform-box: fill-box; transform-origin: center; animation: breathe 1.6s ease-in-out infinite; }
  @keyframes breathe { 50% { transform: scale(1.35); opacity: 0.15; } }
  #pk-pill { fill: var(--kind); stroke: rgba(255, 255, 255, 0.85); stroke-width: 1.5; filter: drop-shadow(0 3px 6px rgba(0, 0, 0, 0.35)); }
  #pk-text { fill: #0b1220; font: 700 13px ui-monospace, SFMono-Regular, Menlo, monospace; text-anchor: middle; }
  #packet { pointer-events: none; transition: opacity 0.25s; }
  #packet.hidden { opacity: 0; }
  .spot { fill: none; stroke: var(--sc); stroke-width: 3; rx: 18; opacity: 0; transition: opacity 0.3s; pointer-events: none; }
  .spot.show { opacity: 0.9; }
  .fork { display: grid; gap: 8px; margin-top: 12px; }
  .fork b { font-size: 13px; color: var(--sc); }
  .fork-opt { text-align: left; padding: 10px 12px; border-radius: 10px; border: 1.5px solid color-mix(in srgb, var(--sc) 55%, transparent); background: color-mix(in srgb, var(--sc) 12%, transparent); color: inherit; font: inherit; font-weight: 600; cursor: pointer; }
  .fork-opt:hover, .fork-opt.picked { background: color-mix(in srgb, var(--sc) 30%, transparent); border-color: var(--sc); }
  .step-list li.pending { opacity: 0.6; font-style: italic; }
  /* zoomable boxes: the outside texts make room for what's inside */
  .outer, .inner { transition: opacity 0.35s; }
  .inner { opacity: 0; pointer-events: none; }
  .el.open .inner { opacity: 1; }
  .el.open .outer { opacity: 0; }
  .el.zoomable:not(.open) .zoom-mark { opacity: 0.8; }
  .zoom-mark { opacity: 0; fill: var(--on-box-muted); font-size: 11px; transition: opacity 0.35s; }
  .in-title { fill: var(--on-box); font-size: 9px; font-weight: 700; text-anchor: middle; }
  .in-sub { fill: var(--on-box-muted); font-size: 5.6px; text-anchor: middle; }
  .in-card { fill: rgba(255, 255, 255, 0.1); stroke: rgba(255, 255, 255, 0.28); stroke-width: 0.6; transition: stroke 0.2s, fill 0.2s; }
  .in-name { fill: var(--on-box); font-size: 7px; font-weight: 700; text-anchor: middle; }
  .in-text { fill: var(--on-box); font-size: 5.6px; }
  .in-text.mid { text-anchor: middle; }
  .in-muted { fill: var(--on-box-muted); font-size: 5px; text-anchor: middle; }
  .in-chip { fill: rgba(0, 0, 0, 0.28); }
  .in-chip-text { fill: #fde68a; font-size: 5.6px; font-weight: 700; text-anchor: middle; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  .in-num { fill: rgba(0, 0, 0, 0.3); }
  .in-num-text { fill: var(--on-box); font-size: 5px; font-weight: 700; text-anchor: middle; }
  .inner [data-inner] { transition: opacity 0.35s; }
  #scene.inner-focus .el.open [data-inner]:not(.ihl) { opacity: 0.35; }
  [data-inner].ihl .in-card { stroke: var(--sc); stroke-width: 1.4; fill: color-mix(in srgb, var(--sc) 30%, transparent); }
  .in-ok { fill: #4ade80; font-size: 12px; font-weight: 900; paint-order: stroke; stroke: #14532d; stroke-width: 1.5px; text-anchor: end; opacity: 0; transition: opacity 0.3s; }
  [data-inner].ihl .in-ok { opacity: 1; }
  .in-ok.big { font-size: 22px; }
  .in-arrow { stroke: var(--on-box-muted); stroke-width: 0.8; fill: none; }
  .in-arrow-head { fill: var(--on-box-muted); }
  .in-big { font-size: 22px; text-anchor: middle; }
  .edge.hl .rel { stroke: var(--sc); stroke-width: 3.5; stroke-dasharray: 10 8; animation: march 0.7s linear infinite; }
  .edge.hl .rel-label { fill: var(--sc); }
  @keyframes march { to { stroke-dashoffset: -18; } }

  /* side panel */
  .side {
    top: 16px; right: 16px; bottom: 72px; width: 400px; z-index: 5; display: flex; flex-direction: column; overflow: hidden;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.18); transform: translateX(calc(100% + 32px));
    transition: transform 0.45s cubic-bezier(0.2, 0.8, 0.2, 1);
  }
  .side.open { transform: none; }
  .side-head { display: flex; align-items: center; gap: 8px; padding: 12px 12px 12px 16px; border-bottom: 1px solid var(--panel-border); }
  .side-head h2 { margin: 0; flex: 1; font-size: 15px; font-weight: 700; }
  .icon-btn { width: 30px; height: 30px; border: 0; border-radius: 7px; background: transparent; color: var(--muted); font-size: 15px; cursor: pointer; }
  .icon-btn:hover { background: var(--panel-border); color: var(--text); }
  #side-body { flex: 1; overflow: auto; padding: 14px 16px 16px; }
  .intro { margin: 0 0 14px; font-size: 13px; line-height: 1.5; color: var(--muted); }
  .cards { display: flex; flex-direction: column; gap: 10px; }
  .sc-card {
    position: relative; display: flex; flex-direction: column; gap: 6px; width: 100%; padding: 12px 14px 12px 18px;
    text-align: left; cursor: pointer; overflow: hidden; font: inherit; color: var(--text);
    background: var(--card); border: 1px solid var(--panel-border); border-radius: 11px; transition: transform 0.15s, border-color 0.15s;
  }
  .sc-card::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--sc); }
  .sc-card:hover { transform: translateY(-1px); border-color: var(--sc); }
  .sc-card b { font-size: 14px; }
  .sc-card span { font-size: 12.5px; line-height: 1.45; color: var(--muted); }
  .progress { display: flex; gap: 4px; margin-bottom: 12px; }
  .seg { flex: 1; height: 6px; padding: 0; border: 0; border-radius: 3px; background: var(--panel-border); cursor: pointer; }
  .seg.done { background: color-mix(in srgb, var(--sc) 50%, transparent); }
  .seg.now { background: var(--sc); box-shadow: 0 0 10px color-mix(in srgb, var(--sc) 60%, transparent); }
  .step-card { padding: 16px; border-radius: 13px; background: var(--card); border: 1px solid var(--panel-border); border-top: 3px solid var(--sc); animation: card-in 0.35s ease-out; }
  @keyframes card-in { from { opacity: 0; transform: translateY(6px); } }
  .step-num { font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--sc); }
  .step-card h3 { margin: 4px 0 8px; font-size: 18px; line-height: 1.3; }
  .step-card p { margin: 0; font-size: 14px; line-height: 1.55; }
  .step-card code, .d-body code { font: 12.5px ui-monospace, SFMono-Regular, Menlo, monospace; padding: 1px 5px; border-radius: 5px; background: var(--chip-bg); }
  .controls { display: flex; gap: 8px; margin: 14px 0; }
  .ctl {
    height: 40px; min-width: 44px; padding: 0 12px; border-radius: 10px; cursor: pointer; font: inherit; font-size: 14px; font-weight: 650;
    color: var(--text); background: var(--card); border: 1px solid var(--panel-border);
  }
  .ctl:disabled { opacity: 0.35; cursor: default; }
  .ctl.primary { flex: 1; color: #fff; border-color: transparent; background: var(--sc); box-shadow: 0 6px 16px color-mix(in srgb, var(--sc) 40%, transparent); }
  .step-list { list-style: none; margin: 4px 0 0; padding: 0; }
  .step-list li { display: flex; align-items: center; gap: 10px; padding: 7px 8px; border-radius: 8px; font-size: 13px; color: var(--muted); cursor: pointer; }
  .step-list li:hover { background: var(--chip-bg); }
  .step-list li span { flex: none; width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; font-size: 11px; font-weight: 700; background: var(--chip-bg); }
  .step-list li.done span { background: color-mix(in srgb, var(--sc) 55%, transparent); color: #fff; }
  .step-list li.now { background: color-mix(in srgb, var(--sc) 13%, transparent); color: var(--text); font-weight: 600; }
  .step-list li.now span { background: var(--sc); color: #fff; }

  /* detail card */
  .detail { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; padding: 16px; background: rgba(8, 11, 18, 0); transition: background 0.3s; }
  .detail.open { background: rgba(8, 11, 18, 0.45); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); }
  .detail-card {
    width: min(680px, 100%); max-height: calc(100vh - 32px); overflow: auto; background: var(--card-solid);
    border: 1px solid var(--panel-border); border-top: 4px solid var(--sc, var(--active)); border-radius: 16px;
    box-shadow: 0 30px 80px rgba(0, 0, 0, 0.4); transform: scale(0.04); opacity: 0;
    transition: transform 0.5s cubic-bezier(0.2, 0.9, 0.25, 1), opacity 0.3s;
  }
  .detail.open .detail-card { transform: none; opacity: 1; }
  .d-head { display: flex; align-items: flex-start; gap: 12px; padding: 18px 18px 6px 22px; }
  .d-head > div { flex: 1; }
  .d-eyebrow { font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--active); }
  .d-head h2 { margin: 4px 0 2px; font-size: 22px; }
  .d-body { padding: 6px 22px 22px; font-size: 14px; line-height: 1.55; }
  .d-body ul { margin: 8px 0; padding-left: 20px; }
  .d-body li { margin: 4px 0; }
  .d-h { margin: 16px 0 4px; font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
  .today { margin-top: 14px; padding: 10px 14px; border-radius: 11px; background: var(--chip-bg); }
  .today b { color: var(--muted); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; display: block; margin-bottom: 2px; }
  .c4-jump {
    display: flex; width: fit-content; margin-top: 16px; padding: 9px 14px; border-radius: 9px; text-decoration: none;
    font-size: 13.5px; font-weight: 650; color: #fff; background: var(--active);
  }
  .c4-jump:hover { filter: brightness(1.1); }
  .todo-badge { font-size: 10px; font-weight: 800; letter-spacing: 0.08em; padding: 2px 6px; border-radius: 5px; background: #f59e0b; color: #1f1300; }

  @media (max-width: 760px) {
    .side { left: 16px; right: 16px; width: auto; top: auto; bottom: 16px; height: 52vh; transform: translateY(calc(100% + 32px)); }
  }
  @media (prefers-reduced-motion: reduce) {
    .side, .detail-card, .detail { transition: none; }
    .edge.hl .rel { animation: none; }
  }
</style>
</head>
<body>

<div id="viewport">
  <svg aria-label="Hypothetical production deployment of the Product Catalog">
    <defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M0,0 L10,5 L0,10 z" class="arrowhead"/>
      </marker>
    </defs>
    <g id="scene"></g>
  </svg>
</div>

<header class="panel">
  <h1>Product Catalog · Production (simplified)</h1>
  <span class="hypo" title="This is a target picture, not what exists today">HYPOTHETICAL</span>
  <a class="link-btn" href="c4-model.html">← C4 model</a>
  <button id="sc-btn" class="sc-btn" aria-pressed="false" title="Walk through what happens in production (S)">
    <svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2.5 1.5v9l8-4.5z"/></svg>Scenarios
  </button>
</header>

<div class="panel hint">
  Scroll or drag to move · Pinch or ⌘/Ctrl + scroll to zoom<br>
  <strong id="hint">Click any box for what it is, why it&#39;s there and what the demo does today · ⤢ boxes zoom in</strong>
</div>

<div class="panel toolbar">
  <button id="zoom-out" aria-label="Zoom out">−</button>
  <span class="zoom" id="zoom-level">100%</span>
  <button id="zoom-in" aria-label="Zoom in">+</button>
  <button id="fit" class="fit" aria-label="Fit to screen">Fit</button>
</div>

<aside id="side" class="panel side" aria-label="Scenarios">
  <div class="side-head">
    <button id="side-back" class="icon-btn" aria-label="All scenarios" hidden>←</button>
    <h2 id="side-title">Scenarios</h2>
    <button id="side-close" class="icon-btn" aria-label="Close">✕</button>
  </div>
  <div id="side-body"></div>
</aside>

<div id="detail" class="detail" hidden>
  <div id="detail-card" class="detail-card" role="dialog" aria-modal="true" aria-labelledby="d-title">
    <div class="d-head">
      <div><div id="d-eyebrow" class="d-eyebrow"></div><h2 id="d-title"></h2></div>
      <button id="d-close" class="icon-btn" aria-label="Close">✕</button>
    </div>
    <div id="d-body" class="d-body"></div>
  </div>
</div>

<script>
  (function () {
    const $ = (id) => document.getElementById(id);
    const NS = 'http://www.w3.org/2000/svg';
    const viewport = $('viewport');
    const scene = $('scene');

    // ---- the picture ------------------------------------------------------
    // Same company, different teams: each team deploys its own services, on a shared platform.
    // Only the Product Catalog (catalog-service + its database) is ours. The PIM, the Webshop and the Price System are other teams' services.
    const ZONES = [
      { x: 380, y: 470, w: 800, h: 840, name: 'Our production setup', kind: '[Kubernetes, in the cloud: e.g. AWS EKS or Azure AKS]', ours: true, right: true },
    ];

    const EL = {
      pm: { type: 'person', cx: 200, cy: 90, name: 'Product manager', kind: '[Person]', lines: ['Edits products'] },
      shopper: { type: 'person', cx: 760, cy: 90, name: 'Shopper', kind: '[Person]', lines: ['Browses the shop'] },
      prm: { type: 'person', cx: 1320, cy: 90, name: 'Pricing manager', kind: '[Person]', lines: ['Sets prices'] },
      pim: { type: 'box', cls: 'other', x: 60, y: 260, w: 280, h: 140, name: 'PIM', kind: '[other team]', lines: ['owns the product data'] },
      webshop: { type: 'box', cls: 'other', x: 620, y: 260, w: 280, h: 140, name: 'Webshop', kind: '[other team]', lines: ['the shop'] },
      priceSys: { type: 'box', cls: 'other', x: 1180, y: 260, w: 280, h: 140, name: 'Price System', kind: '[other team]', lines: ['knows the prices'] },

      const xs = [...path.map((p) => p[0]), b.x, b.x + b.width], ys = [...path.map((p) => p[1]), b.y, b.y + b.height];
      const x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys);
      const w = Math.max(x1 - x0 + 300, 1100), hh = Math.max(y1 - y0 + 300, 700);
      return { x: (x0 + x1) / 2 - w / 2, y: (y0 + y1) / 2 - hh / 2, w, h: hh };
    }
    function frameStep() {
      if (!sc) return;
      const step = steps()[stepIndex];
      flyTo(step.zoomIn && arrived ? boxBounds(step.at) : stepBounds(step, pathOf(stepIndex)), 500, step.zoomIn && arrived ? BOX_ZOOM : MAX);
    }

    let packetAnim = null, arrived = false, innerTimers = [], picks = {};
    // the steps of the chosen path: a fork ends the list until an option is picked
    function steps() {
      const out = [];
      (function walk(list) {
        for (const st of list) {
          out.push(st);
          if (st.fork) {
            const o = st.fork.options.find((x) => x.id === picks[st.fork.id]);
            if (o) walk(o.steps);
            return;
          }
        }
      })(sc.steps);
      return out;
    }
    function runStep(i) {
      stepIndex = Math.min(Math.max(i, 0), steps().length - 1);
      const step = steps()[stepIndex];
      cancelAnimationFrame(packetAnim);
      innerTimers.forEach(clearTimeout); innerTimers = [];
      clearHighlight();
      arrived = false;
      scene.style.setProperty('--sc', sc.color);
      scene.classList.add('dimmed');
      for (const id of new Set([step.at, ...(step.els || [])])) scene.querySelector(`[data-el="${id}"]`).classList.add('hl');
      setOpen([]);
      // past steps leave a faint trail, this step draws its own as the packet moves
      const trails = $('trails');
      trails.replaceChildren();
      const all = steps();
      for (let j = 0; j < stepIndex; j++) if (all[j].path) svg('path', { class: 'trail', d: polyline(all[j].path).d }, trails);
      const path = pathOf(stepIndex), line = polyline(path), now = $('trail-now');
      now.setAttribute('d', line.d);
      now.style.strokeDasharray = `${line.total} ${line.total + 1}`;
      now.style.strokeDashoffset = line.total;
      setPacket(step.label || '', step.kind);
      placePacket(line.at(0));
      if (!step.path) packetEl().classList.add('hidden'); // nothing travels: a check inside the box
      renderSteps();
      flyTo(stepBounds(step, path));

      const duration = reduceMotion || !line.total ? 0 : Math.min(Math.max(600 + line.total * 0.9, 900), 3000);
      const t0 = performance.now() + (reduceMotion ? 0 : 250);
      (function frame() {
        const q = duration ? Math.min(Math.max((performance.now() - t0) / duration, 0), 1) : 1;
        const e = q < 0.5 ? 2 * q * q : 1 - Math.pow(-2 * q + 2, 2) / 2;
        placePacket(line.at(line.total * e));
        now.style.strokeDashoffset = line.total * (1 - e);
        if (q < 1) { packetAnim = requestAnimationFrame(frame); return; }
        // arrived: light up the box, and open it if this step looks inside
        arrived = true;
        spotlight(step.at);
        if (step.open) {
          packetEl().classList.add('hidden'); // the box opens: let its inside be read
          setOpen(step.open);
          scene.classList.toggle('inner-focus', !!(step.inner && step.inner.length));
          (step.inner || []).forEach((id, n) => innerTimers.push(setTimeout(() => scene.querySelector(`[data-inner="${id}"]`).classList.add('ihl'), reduceMotion ? 0 : 500 + n * 450)));
        }
        if (step.zoomIn) flyTo(boxBounds(step.at), 700, BOX_ZOOM);
      })();
    }

    function renderList() {
      $('side-title').textContent = 'Scenarios';
      $('side-back').hidden = true;
      $('side-body').innerHTML = `
        <p class="intro">What would happen in production, step by step. The parts involved light up; click any box for the details.</p>
        <div class="cards">${SCENARIOS.map((s) => `
          <button class="sc-card" data-sc="${s.id}" style="--sc:${s.color}"><b>${s.name}</b><span>${s.desc}</span></button>`).join('')}</div>`;
      $('side-body').querySelectorAll('[data-sc]').forEach((b) => b.addEventListener('click', () => startScenario(b.dataset.sc)));
    }
    function renderSteps() {
      const all = steps();
      const step = all[stepIndex];
      const waiting = !!step.fork && !picks[step.fork.id] && stepIndex === all.length - 1;
      const last = stepIndex === all.length - 1 && !waiting;
      const next = SCENARIOS[SCENARIOS.indexOf(sc) + 1];
      side.style.setProperty('--sc', sc.color);
      $('side-title').textContent = sc.name;
      $('side-back').hidden = false;
      $('side-body').innerHTML = `
        <div class="progress">${all.map((_, i) => `<button class="seg${i < stepIndex ? ' done' : ''}${i === stepIndex ? ' now' : ''}" data-step="${i}" aria-label="Step ${i + 1}"></button>`).join('')}</div>
        <article class="step-card">
          <div class="step-num">Step ${stepIndex + 1}</div>
          <h3>${step.title}</h3>
          ${step.text ? `<p>${step.text}</p>` : ''}
          ${step.fork ? `<div class="fork"><b>◆ ${step.fork.question}</b>${step.fork.options.map((o) =>
            `<button class="fork-opt${picks[step.fork.id] === o.id ? ' picked' : ''}" data-opt="${o.id}">${o.label}</button>`).join('')}</div>` : ''}
        </article>
        <div class="controls">
          <button class="ctl" id="prev" ${stepIndex === 0 ? 'disabled' : ''} aria-label="Previous step">←</button>
          ${waiting ? '<button class="ctl primary" disabled>Choose above ↑</button>'
                 : last ? (next ? `<button class="ctl primary" id="next-sc">Next: ${next.name} →</button>` : `<button class="ctl primary" id="done">Close</button>`)
                 : `<button class="ctl primary" id="next">Next →</button>`}
        </div>
        <ol class="step-list">${all.map((s, i) => `<li class="${i < stepIndex ? 'done' : ''}${i === stepIndex ? ' now' : ''}" data-step="${i}"><span>${i + 1}</span>${s.title}${s.fork ? ' ◆' : ''}</li>`).join('')}${
          all[all.length - 1].fork && !picks[all[all.length - 1].fork.id] ? '<li class="pending">… depends on the choice</li>' : ''}</ol>`;
      const body = $('side-body');
      body.querySelectorAll('[data-step]').forEach((el) => el.addEventListener('click', () => runStep(+el.dataset.step)));
      $('prev')?.addEventListener('click', () => runStep(stepIndex - 1));
      $('next')?.addEventListener('click', () => runStep(stepIndex + 1));
      $('next-sc')?.addEventListener('click', () => startScenario(next.id));
      $('done')?.addEventListener('click', stopScenario);
      body.querySelectorAll('[data-opt]').forEach((b) => b.addEventListener('click', () => { picks[step.fork.id] = b.dataset.opt; runStep(stepIndex + 1); }));
      body.scrollTop = 0;
    }
    function openSide() { side.classList.add('open'); $('sc-btn').setAttribute('aria-pressed', 'true'); if (!sc) renderList(); }
    function closeSide() { stopScenario(); side.classList.remove('open'); $('sc-btn').setAttribute('aria-pressed', 'false'); fit(500); }
    function startScenario(id) {
      openSide();
      sc = SCENARIOS.find((s) => s.id === id);
      picks = {};
      $('hint').textContent = '→ or Space: next step · ←: back · Esc: leave the scenario · click any box for details';
      runStep(0);
    }
    function stopScenario() {
      if (!sc) return;
      sc = null;
      cancelAnimationFrame(packetAnim);
      clearHighlight();
      setOpen([]);
      $('trails').replaceChildren();
      $('trail-now').setAttribute('d', '');
      packetEl().classList.add('hidden');
      renderList();
      $('hint').textContent = HINT;
      fit(500);
    }
    $('sc-btn').addEventListener('click', () => (side.classList.contains('open') ? closeSide() : openSide()));
    $('side-close').addEventListener('click', closeSide);
    $('side-back').addEventListener('click', stopScenario);

    window.addEventListener('keydown', (e) => {
      if (!detail.hidden) { if (e.key === 'Escape') closeInfo(); return; }
      if (e.key === '+' || e.key === '=') { e.preventDefault(); zoomCenter(1.25); }
      else if (e.key === '-') { e.preventDefault(); zoomCenter(0.8); }
      else if (e.key === '0') fit(400);
      else if (e.key === 's' || e.key === 'S') side.classList.contains('open') ? closeSide() : openSide();
      else if (sc && (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'Enter')) {
        e.preventDefault();
        const all = steps(), cur = all[stepIndex];
        if (stepIndex < all.length - 1) runStep(stepIndex + 1);
        else if (cur.fork && !picks[cur.fork.id]) {} // waiting for a choice
        else { const n = SCENARIOS[SCENARIOS.indexOf(sc) + 1]; n ? startScenario(n.id) : stopScenario(); }
      }
      else if (sc && e.key === 'ArrowLeft') runStep(stepIndex - 1);
      else if (e.key === 'Escape') { if (sc) stopScenario(); else if (closeBoxes()) {} else if (side.classList.contains('open')) closeSide(); }
    });
    // Keyboard: Enter on a focused box opens its card.
    scene.addEventListener('keydown', (e) => {
      const el = e.target.closest?.('[data-el]');
      if (!el || (e.key !== 'Enter' && e.key !== ' ')) return;
      e.preventDefault();
      e.stopPropagation();
      const r = el.getBoundingClientRect();
      clickBox(el.dataset.el, r.left + r.width / 2, r.top + r.height / 2);
    });

    draw();
    renderList();
    fit();
  })();
</script>
</body>
</html>
