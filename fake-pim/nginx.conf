server {
    listen 80;
    root /usr/share/nginx/html;

    # Same origin as the page, so the browser needs no CORS.
    location /api/ {
        proxy_pass http://catalog-service:8080/;
    }

    location /price-api/ {
        proxy_pass http://fake-price-service:8080/;
    }

    location / {
        try_files $uri /index.html;
    }
}
